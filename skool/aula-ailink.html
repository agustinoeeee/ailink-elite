ota": "Los 7 pasos con tiempos y frases modelo: tenlo delante durante la llamada.", "estado": "falta"}, {"nombre": "F5-acuerdo-servicios-esqueleto.pdf", "tipo": "PDF", "nota": "Esqueleto en lenguaje llano para adaptar y pasar por un abogado antes de usarlo.", "estado": "falta"}, {"nombre": "F5-formulario-arranque-cliente (enlace Tally)", "tipo": "Formulario", "nota": "Enlace a la plantilla en Tally para duplicar y montar el tuyo; no es un PDF.", "estado": "enlace"}], "pantallaReal": "Tally/Typeform montando el formulario de arranque campo a campo, y la conexión del formulario como redirección del Payment Link de Stripe: circuito pago → formulario probado en vivo."}, {"id": "L3", "emoji": "🔧", "titulo": "El build: de demo a producción", "duracion": "10-14 min", "descripcion": "Conviertes la demo de F2 en el piloto real del cliente: datos reales dentro y funcionando en ≤5 días de trabajo sobre los 7 comprometidos.\n\n**En esta lección:**\n- Los tres saltos de demo a producción: datos reales, usuarios reales, integraciones reales. La demo convence; la producción trabaja.\n- Tu brief de F2 ampliado con dos secciones: 7. datos reales del cliente · 8. integraciones que entran (solo las del alcance ENTRA).\n- Las integraciones a nivel de flujo: WhatsApp Business API vía proveedor, chat libre con la API de Anthropic —coste repercutido al cliente— y lo legal si la solución es pública.\n- Construir en pasos sobre el repo de tu demo, con el calendario del día 1 al 5, y los atascos comunicados por ti antes de que el cliente pregunte.\n\n**Tu acción ahora:** amplía tu brief de F2 con las secciones 7 y 8, comprueba que tienes todos los datos del formulario de arranque y dale a Claude Code la primera instrucción del build hoy mismo.\n\n**KPI:** piloto funcionando con datos reales del cliente en ≤5 días de trabajo (sobre 7 comprometidos).", "adjuntos": [{"nombre": "F2-plantilla-brief-solucion.pdf", "tipo": "PDF", "nota": "(ya descargada en F2-L3) Aquí le añades las secciones 7 y 8 de producción.", "estado": "repetido", "ruta": "ya subido en F2 · L3"}], "pantallaReal": "Pantalla partida con la demo de F2 y el repo del proyecto real creado a partir de ella; la plantilla de brief abriéndose y añadiéndole en directo las secciones 7 y 8; Claude Code sustituyendo el simulador de WhatsApp por la integración real, con el primer mensaje llegando a un móvil físico."}, {"id": "L4", "emoji": "💬", "titulo": "Haz visible el invisible", "duracion": "8-12 min", "descripcion": "Montas el sistema que elimina la única razón por la que un cliente se va en la primera semana: el silencio.\n\n**En esta lección:**\n- El estándar: mínimo 1 toque visible al día. Toque visible es algo que se puede VER —foto, captura, vídeo corto—; \"todo va bien\" no cuenta.\n- El plan día a día: día 0 \"arrancamos\" con foto, día 1 la llamada de arranque, día 2 captura de progreso, día 3 vídeo de 60-90s con algo funcionando, día 4 el hito con SUS datos, día 5 entrega parcial para que lo pruebe él.\n- Celebrar los hitos y guardar las reacciones del cliente: son la materia prima de tu testimonio (L6).\n- Nervios y peticiones de extras: respuesta el mismo día, fórmula dato + siguiente paso, y recentrar en el alcance firmado.\n\n**Tu acción ahora:** adapta los 6 mensajes modelo del plan con el nombre de tu cliente y de su solución, y envía HOY el que toque según tu día de build (si acabas de cobrar, el de día 0, con foto).\n\n**KPI:** racha de toques visibles = días de build. Ni un día en blanco desde el cobro hasta la entrega.", "adjuntos": [{"nombre": "F5-plan-comunicacion-build.pdf", "tipo": "PDF", "nota": "La tabla del día 0 al 7 y los 6 mensajes modelo listos para copiar.", "estado": "falta"}], "pantallaReal": ""}, {"id": "L5", "emoji": "✅", "titulo": "QA de producción y entrega", "duracion": "10-14 min", "descripcion": "Entregas con el QA pasado, el cliente formado y los criterios de aceptación firmados: una entrega rota destruye en 5 minutos la confianza de 3 semanas.\n\n**En esta lección:**\n- El QA de producción: flujo completo tres veces con datos reales, el usuario real recorriéndolo delante de ti sin ayuda, casos límite del negocio, errores dignos y móvil con la URL real.\n- La regla intacta de F2: nada se entrega sin la checklist completa, y esa firma es tu permiso para entregar.\n- Formación en dos piezas: vídeo de uso de 2-3 minutos y sesión de traspaso de 20-30 minutos donde el CLIENTE maneja la solución, no tú.\n- El cierre formal: los criterios de aceptación se repasan y se marcan JUNTOS; lo que surja nuevo va a la fase 2. Y 15 minutos para documentar lo entregado.\n\n**Tu acción ahora:** pasa entera la checklist de entrega con tu piloto, agenda la sesión de traspaso con tu cliente y graba el vídeo de uso de 2-3 minutos.\n\n**KPI:** checklist de entrega completa y firmada + criterios de aceptación marcados \"terminado\" junto al cliente.", "adjuntos": [{"nombre": "F5-checklist-entrega-produccion.pdf", "tipo": "PDF", "nota": "Los 4 bloques —QA, formación, cierre y post— hasta la firma ENTREGADO.", "estado": "falta"}], "pantallaReal": "El piloto en producción durante el QA: flujo completo con datos reales, prueba en móvil con la URL real y un fallo de integración forzado para enseñar el 'error digno'. Además, la grabación del vídeo de uso de 2-3 minutos."}, {"id": "L6", "emoji": "💶", "titulo": "Cobra, captura y encadena", "duracion": "8-12 min", "descripcion": "El día de la entrega vale por tres —cobro final, prueba social y siguiente cliente— y hoy aprendes a llevarte las tres en el mismo día.\n\n**En esta lección:**\n- El cobro final se envía el día de la entrega: el mejor día para cobrar es el del \"wow\", con la tarjeta ya guardada en Stripe desde F0/F4.\n- Capturar la prueba en el pico emocional: crudo gana a pulido, muchos mini-testimonios ganan a uno épico, y los tres formatos ordenados por fricción.\n- Las 4 preguntas del testimonio y dónde va cada pieza: rellenan los huecos [PRUEBA SOCIAL] de tu máquina de F3. Pide permiso por escrito antes de publicar nada.\n- El referido en una sola frase y la semilla del retainer: hoy se planta, no se cosecha (eso es F6).\n\n**Tu acción ahora:** copia en tu móvil la frase de petición del audio y la frase del referido, y déjalas listas como mensajes guardados para el día de tu entrega.\n\n**KPI:** en las 24h siguientes a tu entrega: cobro final enviado + 1 testimonio capturado (audio, vídeo o reseña) + referido pedido.", "adjuntos": [{"nombre": "F5-guia-testimonio-referido.pdf", "tipo": "PDF", "nota": "Cuándo y cómo pedirlo, los 3 formatos, las 4 preguntas y la frase del referido.", "estado": "falta"}], "pantallaReal": "Stripe enviando la factura del 50% restante con la tarjeta del cliente ya guardada desde F0/F4 (captura breve)."}, {"id": "L7", "emoji": "🏭", "titulo": "Tu fábrica: cada entrega te hace más rápido", "duracion": "6-9 min", "descripcion": "Conviertes la entrega que acabas de hacer en una plantilla reutilizable, para que el siguiente cliente del mismo nicho te cueste la mitad.\n\n**En esta lección:**\n- El principio de infraestructura reutilizable: el cliente se queda SU solución y sus datos; tú te quedas el CÓMO, limpio de todo lo suyo.\n- Los 4 activos que guardas de cada proyecto: el repo limpio, el brief tipo del nicho, los atascos con su solución y los mensajes que funcionaron.\n- El ritual post-entrega de 30 minutos, dentro de los 3 días siguientes: lo que no entra ahí, no entra nunca.\n- El efecto compuesto: 5 días de build → 3 → 2 (cifras ilustrativas). Mismo precio, más margen y más capacidad, que es la base sobre la que escalas en F6.\n\n**Tu acción ahora:** ejecuta hoy el ritual de 30 minutos con tu entrega: crea la carpeta `mi-biblioteca/`, guarda los 4 activos de tu primer proyecto y estrena el inventario con su primera fila.\n\n**KPI:** primera plantilla propia completa en tu biblioteca (los 4 activos) e inventario iniciado con nicho, solución y tiempo real del build.", "adjuntos": [{"nombre": "F5-biblioteca-plantillas.pdf", "tipo": "PDF", "nota": "La estructura de la biblioteca, los 4 activos y el ritual de 30 minutos.", "estado": "falta"}, {"nombre": "F5-biblioteca-plantillas-inventario.csv", "tipo": "CSV", "nota": "La tabla de inventario aparte, para rellenar en tu hoja de cálculo.", "estado": "listo", "ruta": "adjuntos-skool/6-entrega/L07-F5-biblioteca-plantillas-inventario.csv"}], "pantallaReal": "Claude Code generando la copia plantilla del repo —borrando datos, credenciales y nombres del cliente y sustituyéndolos por marcadores— y la carpeta mi-biblioteca/ recién creada con sus 4 activos dentro."}]}, {"codigo": "F6", "nombreCurso": "F6 | Escala — retención y MRR", "palabraTarjeta": "Escala", "descripcionCurso": "Conviertes al cliente que ya te pagó una vez en ingreso recurrente: sistema de retención, primer retainer con cobro automático y los seis números con los que pilotas tu agencia. Cierra los 90 días con el mapa para escalar sin romperte.", "semanas": "Semanas 11-13", "lecciones": [{"id": "L1", "emoji": "📉", "titulo": "El negocio de verdad empieza al cobrar", "duracion": "7-10 min", "descripcion": "Sales de esta lección sabiendo por qué se te van los clientes de verdad —y no es por los resultados— y con los dos números que gobiernan toda esta fase.\n\n**En esta lección:**\n- La matemática que nadie mira: retener cuesta en torno a 9 veces menos que captar, y un cliente de 12 meses vale de 4 a 6 veces uno de 3.\n- Los tres motivos reales del churn (la fuga de clientes): cerca de dos tercios se van por abandono percibido, es decir, por tu silencio.\n- Por qué la retención es un sistema de comunicación y no un rasgo de personalidad: proactivo frente a reactivo.\n- Los dos números de F6: churn de retainers por debajo del 5% mensual y % de referidos por encima del churn.\n\n**Tu acción ahora:** abre WhatsApp y mira la fecha de tu último mensaje proactivo al cliente al que ya entregaste (uno que no fuera respuesta a algo suyo). Si hace más de una semana, escríbele hoy: una línea con un dato de su solución y qué estás mirando esta semana.\n\n**KPI:** los dos números de la fase apuntados donde los veas a diario (churn mensual <5% y % de referidos > churn) y cero clientes con más de 7 días sin contacto proactivo.", "adjuntos": [], "pantallaReal": ""}, {"id": "L2", "emoji": "🗓️", "titulo": "El sistema de retención", "duracion": "10-14 min", "descripcion": "Sales con la cadencia de retención instalada: las cinco piezas puestas en tu calendario y una ficha creada por cada cliente de retainer. Cuesta 1-2 horas al mes por cliente.\n\n**En esta lección:**\n- Las cinco piezas: informe mensual de valor, llamada quincenal de 15-20 min, récord celebrado en menos de 1 hora, alerta del problema antes de que él lo vea y proof-of-work mensual.\n- El informe mensual en una página: 3 números suyos, qué he mejorado y qué viene el mes que viene.\n- Infraprometer sigue vivo: comprometes poco y entregas más, en cada mejora y cada plazo.\n- La ficha por cliente: último contacto proactivo, próximo hito, señales de alarma e historial de récords.\n\n**Tu acción ahora:** abre la cadencia de retención, crea la ficha de tu cliente de retainer (o del que está sembrado desde F5), ponle fecha al primer informe mensual en tu calendario y propón por WhatsApp la primera llamada quincenal.\n\n**KPI:** cadencia instalada — 1 ficha por cliente + informe mensual con fecha en el calendario + primera quincenal agendada + cero días sin saber cuándo fue tu último contacto proactivo.", "adjuntos": [{"nombre": "F6-cadencia-retencion.pdf", "tipo": "PDF", "nota": "La cadencia completa en tabla y la ficha de cliente para duplicar una por cliente.", "estado": "falta"}, {"nombre": "F6-guion-llamada-quincenal.pdf", "tipo": "PDF", "nota": "La hoja que tienes delante durante la quincenal: 5 pasos con sus minutos.", "estado": "falta"}], "pantallaReal": ""}, {"id": "L3", "emoji": "💳", "titulo": "El retainer: tu MRR", "duracion": "10-14 min", "descripcion": "Sales con el hito maestro del programa en marcha: tu primer retainer propuesto, firmado y con el cobro automático activo.\n\n**En esta lección:**\n- Por qué se propone esta semana y no «ya hablaremos»: el valor percibido está en máximos justo después de entregar.\n- Los 4 bloques del retainer (mantenimiento, mejoras acotadas, soporte con plazos e informe mensual) y lo que NO entra: los proyectos nuevos se presupuestan aparte.\n- La propuesta de una página en lenguaje de resultado, con el coste de API decidido y escrito.\n- La conversación abrir → entregar → cerrar, sin pedir permiso: «lo dejo activo con la tarjeta que ya tienes guardada, primer cargo el día 1».\n\n**Tu acción ahora:** abre la propuesta de retainer, rellénala con los números reales de tu entrega y tu cifra del rango de F1, y agenda (o confirma) la conversación del retainer para esta semana.\n\n**KPI:** primer retainer firmado con cargo automático activo en los 7 días siguientes a tu entrega.", "adjuntos": [{"nombre": "F6-propuesta-retainer.pdf", "tipo": "PDF", "nota": "Página 1 para el cliente; página 2 interna con la checklist previa y los 3 errores.", "estado": "falta"}], "pantallaReal": "La plantilla de propuesta de retainer ya rellenada, recorrida campo a campo en el documento real (no slide); si se graba, Stripe activando el cargo recurrente sobre la tarjeta guardada."}, {"id": "L4", "emoji": "🚨", "titulo": "Señales de alarma y llamadas de rescate", "duracion": "10-14 min", "descripcion": "Aprendes a leer las señales que todo cliente emite semanas antes de irse y a ejecutar la llamada que toca: save, reset o exit.\n\n**En esta lección:**\n- Las señales: respuestas cada vez más cortas, «¿me recuerdas qué incluye lo que pago?», un cobro cuestionado, silencio tras el informe, la mención a un competidor.\n- La regla del programa: dos señales = llamada esta semana, con dos excepciones que van a llamada directa a la primera.\n- Save call: llegas tú primero y más indignado que él, apilas compromisos con fecha y jamás te defiendes.\n- Reset const ICON = {PDF:'pdf', CSV:'csv', 'Enlace':'enlace', 'Formulario':'formulario'};
let cur = null, curL = 0;

function md(t){
  const lines = t.split('\n'); let out=''; let ul=false;
  for (let ln of lines){
    ln = ln.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
           .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
           .replace(/\*(.+?)\*/g,'<em>$1</em>');
    if (ln.trim().startsWith('- ')){
      if(!ul){out+='<ul>';ul=true;}
      out += '<li>'+ln.trim().slice(2)+'</li>';
    } else {
      if(ul){out+='</ul>';ul=false;}
      if(ln.trim()) out += '<p>'+ln+'</p>';
    }
  }
  if(ul) out+='</ul>';
  return out;
}

function home(){
  cur = null;
  document.getElementById('crumb').innerHTML = '<b>Classroom</b>';
  const cards = DATA.map((m,i)=>`
    <button class="card" onclick="openCourse(${i})">
      <div class="cover">
        <div class="eyebrow">AILINK ÉLITE.</div>
        <div class="word">${m.palabraTarjeta}<span>.</span></div>
      </div>
      <div class="cbody">
        <div class="ctitle"><span class="dot"></span>${m.nombreCurso}</div>
        <div class="cdesc">${m.descripcionCurso}</div>
        <div class="cmeta"><span>${m.semanas}</span><span>·</span><span>${m.lecciones.length} lecciones</span></div>
        <div class="bar"><i></i></div>
      </div>
    </button>`).join('');
  document.getElementById('app').innerHTML = `
    <div class="hint"><b>Maqueta de tu aula.</b> Así queda el programa montado en Skool: 7 cursos, 57 lecciones, cada una con su vídeo, su descripción y sus adjuntos. Entra en un curso y usa <b>Copiar descripción</b> para pegarla en el Skool real.
      <div class="hint2">Cada adjunto lleva su sello: <span class="sello ok">listo para subir</span> ya está en <code>adjuntos-skool/</code> con la ruta debajo · <span class="sello no">pendiente de diseño</span> aún no existe · <span class="sello rep">ya subido en LX</span> no se vuelve a subir.</div>
    </div>
    <div class="grid">${cards}</div>`;
  window.scrollTo(0,0);
}

function openCourse(i, l){
  cur = i; curL = l || 0;
  const m = DATA[i];
  document.getElementById('crumb').innerHTML = `<a href="#" onclick="home();return false">Classroom</a> &nbsp;›&nbsp; <b>${m.palabraTarjeta}</b>`;
  document.getElementById('app').innerHTML = `<div class="course">
      <aside class="side">
        <h3>${m.palabraTarjeta}</h3>
        <div class="sub">${m.semanas} · ${m.lecciones.length} lecciones</div>
        <div id="list"></div>
        <button class="btn wide" onclick="copiarCurso()">Copiar el curso entero</button>
        <div class="sidenote">Título, descripción y adjuntos de las ${m.lecciones.length} lecciones, en un solo bloque de texto.</div>
      </aside>
      <section class="main" id="main"></section>
    </div>`;
  paint();
  window.scrollTo(0,0);
}

function paint(){
  const m = DATA[cur], L = m.lecciones[curL];
  document.getElementById('list').innerHTML = m.lecciones.map((x,j)=>`
    <button class="lesson ${j===curL?'on':''}" onclick="pick(${j})">
      <span class="em">${x.emoji}</span><span class="tx">${x.titulo}</span><span class="ck"></span>
    </button>`).join('');

  const att = L.adjuntos.length
    ? L.adjuntos.map(a=>{
        const sello = a.estado==='listo' ? '<span class="sello ok">listo para subir</span>'
          : a.estado==='falta' ? '<span class="sello no">pendiente de diseño</span>'
          : a.estado==='repetido' ? `<span class="sello rep">${a.ruta}</span>`
          : a.estado==='enlace' ? '<span class="sello link">va como enlace</span>' : '';
        const ruta = a.estado==='listo' ? `<br><span class="ruta">${a.ruta}</span>` : '';
        return `<div class="att">
        <span class="ic ${ICON[a.tipo]||'pdf'}">${a.tipo==='Formulario'?'FORM':a.tipo==='Enlace'?'LINK':a.tipo}</span>
        <span class="txt"><span class="nm">${a.nombre}</span> ${sello}<br><span class="nt">${a.nota}</span>${ruta}</span></div>`;
      }).join('')
    : '<div class="none">Esta lección no lleva adjuntos.</div>';

  const rec = L.pantallaReal
    ? `<div class="block"><h4>Nota de grabación · solo la ves tú</h4>
        <div class="rec"><b>Comparte pantalla:</b> ${L.pantallaReal}</div></div>` : '';

  document.getElementById('main').innerHTML = `
    <h1><span>${L.emoji}</span> ${L.titulo}</h1>
    <div class="lmeta">${m.codigo} · ${L.id} · vídeo de ${L.duracion}</div>
    <div class="video"><div class="play">▶</div><div>Vídeo por grabar — ${L.duracion}</div></div>
    <div class="desc">${md(L.descripcion)}</div>
    <div class="block"><h4>Adjuntos de la lección</h4>${att}</div>
    ${rec}
    <div class="acts">
      <button class="btn pri" onclick="copiar('desc')">Copiar descripción</button>
      <button class="btn" onclick="copiar('titulo')">Copiar título</button>
      <button class="btn" onclick="copiar('adjuntos')">Copiar lista de adjuntos</button>
    </div>
    <div class="nav">
      <button class="btn" onclick="pick(${curL-1})" ${curL===0?'disabled style=opacity:.35':''}>← Anterior</button>
      <button class="btn" onclick="pick(${curL+1})" ${curL===m.lecciones.length-1?'disabled style=opacity:.35':''}>Siguiente →</button>
    </div>`;
}

function pick(j){
  const m = DATA[cur];
  if (j<0 || j>=m.lecciones.length) return;
  curL = j; paint();
  document.getElementById('main').scrollIntoView({behavior:'smooth', block:'start'});
}

function aviso(txt){
  const el = document.getElementById('toast');
  el.textContent = txt;
  el.classList.add('on'); setTimeout(()=>el.classList.remove('on'), 1800);
}

function alPortapapeles(t, ok){
  const viejo = () => {
    const ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:-9999px';
    document.body.appendChild(ta); ta.select();
    let bien = false;
    try { bien = document.execCommand('copy'); } catch(e) { bien = false; }
    document.body.removeChild(ta);
    aviso(bien ? ok : 'No se ha podido copiar. Selecciona el texto a mano.');
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(t).then(()=>aviso(ok)).catch(viejo);
  } else { viejo(); }
}

function copiar(qué){
  const L = DATA[cur].lecciones[curL];
  let t = L.descripcion, ok = 'Descripción copiada';
  if (qué==='titulo'){ t = L.emoji + ' ' + L.titulo; ok = 'Título copiado'; }
  if (qué==='adjuntos'){ t = L.adjuntos.map(a=>`${a.nombre} — ${a.nota}`).join('\n') || 'Sin adjuntos'; ok = 'Adjuntos copiados'; }
  alPortapapeles(t, ok);
}

function copiarCurso(){
  const m = DATA[cur];
  const bloques = m.lecciones.map((L,i)=>{
    const ad = L.adjuntos.length
      ? L.adjuntos.map(a=>`- ${a.nombre} — ${a.nota}`).join('\n')
      : '- (sin adjuntos)';
    return [
      `━━━ LECCIÓN ${i+1} de ${m.lecciones.length} ━━━`,
      `TÍTULO: ${L.emoji} ${L.titulo}`,
      `VÍDEO: ${L.duracion}`,
      ``,
      `DESCRIPCIÓN:`,
      L.descripcion,
      ``,
      `ADJUNTOS A SUBIR:`,
      ad,
      L.pantallaReal ? `\nNOTA DE GRABACIÓN (no publicar): ${L.pantallaReal}` : ''
    ].join('\n');
  }).join('\n\n');
  alPortapapeles(`CURSO: ${m.nombreCurso}\nPORTADA: ${m.palabraTarjeta}\n${m.semanas} · ${m.lecciones.length} lecciones\n\n${bloques}`,
    `Curso entero copiado (${m.lecciones.length} lecciones)`);
}

home();
</script>
