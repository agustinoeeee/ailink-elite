<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Aula AILINK Élite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;650;700;800&display=swap">
<style>
:root{
  --app:#0b0b0d; --panel:#161619; --panel2:#1d1d21; --line:#2a2a30;
  --ink:#ececed; --ink2:#9b9ba3; --ink3:#6e6e77;
  --blue:#3d7bfd; --green:#28c76f; --amber:#e0a33e;
  --cover1:#1c2145; --cover2:#0a0a12;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--app);color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--blue);text-decoration:none}

.topbar{position:sticky;top:0;z-index:20;background:rgba(11,11,13,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:11px 20px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.14em;font-size:11px;text-transform:uppercase}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--blue);display:inline-block}
.tag{font-size:11px;color:var(--ink3);border:1px solid var(--line);border-radius:99px;padding:3px 9px}
.topbar .spacer{flex:1}
.crumb{font-size:13px;color:var(--ink2)}
.crumb b{color:var(--ink)}

.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 60px}
.hint{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--blue);
  border-radius:10px;padding:13px 16px;color:var(--ink2);font-size:13.5px;margin-bottom:24px}
.hint b{color:var(--ink)}
.hint2{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hint2 code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  text-align:left;transition:transform .12s ease,border-color .12s ease;display:flex;flex-direction:column}
.card:hover{transform:translateY(-2px);border-color:#3a3a44}
.cover{aspect-ratio:16/8.4;background:linear-gradient(150deg,var(--cover1),var(--cover2));
  padding:16px 20px;display:flex;flex-direction:column;justify-content:space-between}
.cover .eyebrow{font-size:9.5px;letter-spacing:.2em;color:#c9cbe0;text-transform:uppercase;font-weight:700}
.cover .word{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1}
.cover .word span{color:var(--blue)}
.cbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.ctitle{font-size:14.5px;font-weight:650;display:flex;align-items:center;gap:8px}
.dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--ink3);flex:none}
.cdesc{font-size:12.8px;color:var(--ink2);flex:1}
.cmeta{display:flex;gap:10px;font-size:11.5px;color:var(--ink3);padding-top:2px}
.bar{height:6px;border-radius:99px;background:#26262c;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green)}

.course{display:grid;grid-template-columns:296px 1fr;gap:22px;align-items:start}
.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;position:sticky;top:76px}
.side h3{font-size:14px;font-weight:650;margin-bottom:3px}
.side .sub{font-size:11.5px;color:var(--ink3);margin-bottom:12px}
.lesson{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;
  font-size:13.4px;color:var(--ink2);text-align:left;line-height:1.35}
.lesson:hover{background:#212127;color:var(--ink)}
.lesson.on{background:#23232a;color:var(--ink);box-shadow:inset 3px 0 0 var(--amber)}
.lesson .em{flex:none;font-size:14px}
.lesson .tx{flex:1}
.lesson .ck{width:15px;height:15px;border-radius:50%;border:2px solid #3a3a44;flex:none}

.main{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 26px 30px;min-width:0}
.main h1{font-size:22px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.lmeta{color:var(--ink3);font-size:12.5px;margin:6px 0 18px}
.video{aspect-ratio:16/9;border-radius:11px;border:1px dashed #3a3a44;background:
  radial-gradient(120% 120% at 50% 0%,#1a1a20,#111116);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;color:var(--ink3);font-size:13px;margin-bottom:20px}
.video .play{width:54px;height:54px;border-radius:50%;border:1px solid #3a3a44;display:grid;place-items:center;font-size:17px;color:var(--ink2)}

.desc{font-size:14.4px;color:#dcdce0}
.desc p{margin:0 0 11px}
.desc strong{color:var(--ink);font-weight:650}
.desc ul{margin:0 0 13px;padding-left:19px}
.desc li{margin-bottom:5px}
.desc em{color:var(--ink2);font-style:normal}

.block{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
.block h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:11px}
.att{display:flex;align-items:center;gap:11px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;margin-bottom:8px}
.att .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:10px;
  font-weight:800;letter-spacing:.03em;flex:none}
.ic.pdf{background:#3a1f22;color:#f08a8a}.ic.csv{background:#1f3226;color:#79d99e}
.ic.enlace{background:#1f2a3d;color:#8ab4f8}.ic.formulario{background:#332a17;color:#e3bd6a}
.att .txt{min-width:0}
.att .nm{font-size:13.4px;font-weight:600}
.att .nt{font-size:12px;color:var(--ink3)}
.att .ruta{font-size:11.5px;color:var(--ink3);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.sello{display:inline-block;vertical-align:1px;font-size:10px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;border-radius:99px;padding:2px 8px;white-space:nowrap}
.sello.ok{background:#12301f;color:#6fd79b;border:1px solid #1e5237}
.sello.no{background:#33240f;color:#e0a33e;border:1px solid #5a3f16}
.sello.rep{background:#1c1c22;color:var(--ink2);border:1px solid var(--line);text-transform:none;letter-spacing:0;font-weight:600}
.sello.link{background:#141f33;color:#8ab4f8;border:1px solid #23375c}
.none{font-size:13px;color:var(--ink3);font-style:italic}

.rec{background:#181410;border:1px solid #3a2f1c;border-radius:10px;padding:12px 14px;font-size:13px;color:#d9c79b}
.rec b{color:#e0a33e}

.acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600}
.btn:hover{border-color:#45454f}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.wide{display:block;width:100%;margin-top:14px;text-align:center}
.sidenote{font-size:11px;line-height:1.45;color:var(--ink3);margin-top:8px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;border-top:1px solid var(--line);padding-top:16px}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--green);color:#06210f;font-weight:700;font-size:13.5px;padding:10px 18px;border-radius:99px;
  transition:.22s ease;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:900px){
  .course{grid-template-columns:1fr}
  .side{position:static}
  .main{padding:20px}
  .cover .word{font-size:32px}
}
</style>
<header class="topbar">
  <div class="brand"><i></i> AILINK Élite</div>
  <span class="tag">maqueta</span>
  <div class="spacer"></div>
  <div class="crumb" id="crumb"></div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>
<script>
const DATA = [{"codigo": "F0", "nombreCurso": "F0 | Bienvenido — onboarding y setup", "palabraTarjeta": "Bienvenido", "descripcionCurso": "Tus primeros 7 días: kick-off agendada, anteojeras puestas, sistema de decisión instalado y el negocio operativo. Sales de F0 con el vehículo montado y ninguna excusa operativa para empezar a vender.", "semanas": "Semana 1", "lecciones": [{"id": "L1", "emoji": "🎯", "titulo": "Bienvenida a AILINK Élite", "duracion": "5-7 min", "descripcion": "Sales de aquí sabiendo exactamente qué vas a construir en 90 días: una agencia que vende soluciones de IA —software y automatizaciones hechas con Claude Code— a negocios que las necesitan y no saben implementarlas.\n\n**En esta lección:**\n- La promesa real del programa: +5.000€ de facturación acumulada en 90 días, con modelo de proyecto + retainer.\n- Qué NO es esto: cero teoría. Cada lección trae enseñanza, recurso, demo y KPI.\n- El mapa de las 6 fases y por qué el contenido se abre en orden.\n- La única regla: ejecuta rápido, falla rápido, nunca el mismo error dos veces.\n\n**Tu acción ahora:** pasa a la lección 2 y agenda tu kick-off call. Sin pausa: cero tiempo muerto entre decidir y ejecutar.\n\n**KPI:** kick-off agendada en menos de 72 horas desde tu fecha de acceso al programa.", "adjuntos": [], "pantallaReal": ""}, {"id": "L2", "emoji": "📅", "titulo": "Tu kick-off call", "duracion": "3-5 min", "descripcion": "Al terminar tienes tu kick-off reservada y el formulario de onboarding enviado: los dos requisitos para que el programa deje de ser genérico y pase a ser TU plan.\n\n**En esta lección:**\n- Para qué sirve la kick-off: tu situación, tus horas reales y tu presupuesto de captación definen tu ruta en F3.\n- Por qué va ahora y no el lunes que viene: cero tiempo muerto después de una decisión.\n- Cómo rellenar el formulario: números reales, no aspiracionales.\n- El compromiso de asistencia: se reagenda con 24 h de antelación, no se falta sin avisar. Es el estándar que luego vas a exigir a tus clientes.\n\n**Tu acción ahora:** abre el enlace del calendario y reserva tu kick-off; después completa el formulario de onboarding del tirón, antes de cerrar la pestaña.\n\n**KPI:** kick-off agendada en menos de 72 h desde tu acceso + formulario completado antes de la llamada.", "adjuntos": [{"nombre": "Reserva tu kick-off (calendario)", "tipo": "Enlace", "nota": "Enlace directo a tu Cal.com/Calendly — sustituye [LINK CALENDARIO].", "estado": "enlace"}, {"nombre": "Formulario de onboarding (Tally)", "tipo": "Formulario", "nota": "Enlace a Tally, no es un PDF: 9 preguntas, menos de 10 minutos, antes de la llamada.", "estado": "enlace"}], "pantallaReal": "Tu calendario de reservas real con huecos visibles de esta misma semana, y scroll rápido por las 9 preguntas del formulario de Tally."}, {"id": "L3", "emoji": "⭐", "titulo": "Tu norte: qué vida estás construyendo", "duracion": "5-8 min", "descripcion": "Emprender no es el objetivo: es un vehículo. Y si no decides hacia dónde lo conduces, acabas construyendo con mucho esfuerzo la vida de la que querías salir. Hoy decides el destino y lo conviertes en criterios que usarás dentro de dos semanas para elegir nicho.\n\n**En esta lección:**\n- Por qué esto va antes que el nicho: primero qué vida quieres, luego qué cliente encaja con ella.\n- Las 5 preguntas del contexto: tu semana normal dentro de tres años, qué es libertad en unidades, qué no estás dispuesto a sacrificar, qué ingreso y para qué, y pocos clientes de alto valor frente a muchos estandarizados.\n- Los 7 criterios de diseño del negocio — horario, ubicación, ingresos, tipo de cliente, complejidad, soporte y equipo — con su implicación directa sobre lo que puedes vender.\n- La escalera del valor: de «conecto el formulario con su base de clientes» a «el dueño deja de perseguir a su equipo».\n- Las tres verdades del rol: que te encuentren, que crean en ti y que confíen en ti.\n\n**Tu acción ahora:** rellena el norte personal entero — las cinco preguntas, los siete criterios con su implicación y la declaración de propósito — y guárdalo donde puedas releerlo.\n\n**KPI:** declaración de propósito escrita y los 7 criterios rellenos, sin campos en blanco.", "adjuntos": [{"nombre": "F0-norte-personal.pdf", "tipo": "PDF", "nota": "Las 5 preguntas, la tabla de los 7 criterios con su implicación para la oferta, la escalera del valor y la declaración de propósito.", "estado": "listo", "ruta": "adjuntos-skool/1-bienvenido/L03-F0-norte-personal.pdf"}], "pantallaReal": "El recurso norte-personal abierto, recorriendo las cinco preguntas y la tabla de criterios rellenándose fila a fila."}, {"id": "L4", "emoji": "📡", "titulo": "Señal vs ruido", "duracion": "5-8 min", "descripcion": "Te llevas una decisión tomada y firmada: durante 90 días tu única fuente de negocio es este programa y los datos que generas tú ejecutando.\n\n**En esta lección:**\n- Señal (el programa + tu first-party data) frente a ruido (todo lo demás, disfrazado de formación).\n- Las anteojeras de caballo: una ventana cerrada de 90 días, no un cambio de vida.\n- Por qué el ruido se apaga solo en cuanto generas datos propios.\n- La única excepción —un problema concreto que te bloquea— y el orden innegociable: programa → comunidad → fuera.\n\n**Tu acción ahora:** descarga el manifiesto, rellénalo entero incluido tu porqué, fírmalo con la fecha de hoy y deja de seguir hoy mismo al menos 10 cuentas o newsletters de contenido de negocio.\n\n**KPI:** manifiesto firmado con la fecha de hoy + al menos 10 cuentas/newsletters dejadas de seguir.", "adjuntos": [{"nombre": "F0-manifiesto-90-dias.pdf", "tipo": "PDF", "nota": "Hoja de compromiso A4 para imprimir, rellenar y firmar hoy.", "estado": "listo", "ruta": "adjuntos-skool/1-bienvenido/L04-F0-manifiesto-90-dias.pdf"}], "pantallaReal": "El manifiesto abierto en pantalla, recorriendo sus 5 bloques con el cursor."}, {"id": "L5", "emoji": "🌳", "titulo": "Más / Mejor / Nuevo", "duracion": "5-8 min", "descripcion": "Te instalas el árbol de decisión que vas a usar cada vez que tu agencia se atasque —hoy, en la semana 6 o con 5 clientes—: más, mejor o nuevo, en ese orden fijo.\n\n**En esta lección:**\n- Las tres palancas de crecimiento (framework de Alex Hormozi, *$100M Leads*) y por qué tu cerebro salta siempre a la equivocada.\n- La pregunta que resuelve el 90% de tus problemas: «¿hacer más volumen resuelve esto?».\n- Tres situaciones que te van a pasar y qué palanca toca en cada una.\n- El anti-patrón mortal: parar la captación al firmar tus primeros clientes.\n\n**Tu acción ahora:** descarga el framework y rellena las dos líneas finales del árbol —tu mayor tentación de «nuevo» y la palanca que te toca— antes de cerrar. Después imprímelo y fíjalo donde trabajes.\n\n**KPI:** los 2 campos finales del recurso rellenos.", "adjuntos": [{"nombre": "F0-framework-mas-mejor-nuevo.pdf", "tipo": "PDF", "nota": "Póster del árbol de decisión con los 2 campos finales que rellena el alumno.", "estado": "listo", "ruta": "adjuntos-skool/1-bienvenido/L05-F0-framework-mas-mejor-nuevo.pdf"}], "pantallaReal": ""}, {"id": "L6", "emoji": "⚠️", "titulo": "Por qué falla la gente", "duracion": "6-10 min", "descripcion": "Sales vacunado contra los 7 errores que matan agencias antes de despegar, y con tu mayor riesgo personal identificado por escrito.\n\n**En esta lección:**\n- Los dos extremos con los datos: decidir con emociones sin muestra, e ignorar los números que ya tienes.\n- Océanos rojos y entregas sobrecomplicadas: lo genérico es invisible y lo enorme no se entrega.\n- El error nº1, el que mata más que los otros seis juntos: rendirse antes de la muestra (~20 conversaciones para el primer cliente) — y su antídoto: ser resiliente.\n- Fallos técnicos evitables y la huida de las ventas y del seguimiento.\n\n**Tu acción ahora:** escribe cuál de los 7 errores es TU mayor riesgo, sé honesto y compártelo en la comunidad. Después firma tu manifiesto si aún no lo has hecho: es tu vacuna contra el error nº5.\n\n**KPI:** tu error de mayor riesgo identificado y publicado en la comunidad.", "adjuntos": [{"nombre": "F0-manifiesto-90-dias.pdf", "tipo": "PDF", "nota": "(ya descargado en L3) Fírmalo hoy si aún no lo has hecho: es la vacuna del error nº5.", "estado": "repetido", "ruta": "ya subido en L4"}], "pantallaReal": ""}, {"id": "L7", "emoji": "📊", "titulo": "Cómo se decide aquí: datos, no sensaciones", "duracion": "8-12 min", "descripcion": "Te llevas el método con el que se decide en este programa —hipótesis → test → observar → iterar— y las dos reglas de muestra que te impiden decidir con el estómago.\n\n**En esta lección:**\n- Tu agencia como sistema: input → proceso → output → feedback, y por qué produce lo que su diseño dicta, no lo que tú pretendes.\n- Cómo se monta un test válido: una sola variable, constantes, métricas, KPI, muestra y duración.\n- Regresión a la media y las dos reglas de validez: 300 toques de outreach y 30 llamadas realizadas.\n- Versionado V1/V2: cuándo iterar, cuándo volver atrás y cuándo escalar sin tocar nada.\n\n**Tu acción ahora:** copia la plantilla base de tests a tu Google Sheets o Notion y ánclala donde la veas a diario. Apunta las dos reglas de validez en una nota visible.\n\n**KPI:** plantilla copiada y preparada para tu primer V1.", "adjuntos": [{"nombre": "F0-plantilla-base-de-tests.pdf", "tipo": "PDF", "nota": "Reglas de uso, las 2 reglas de validez y la tabla de 12 columnas con el ejemplo relleno.", "estado": "listo", "ruta": "adjuntos-skool/1-bienvenido/L07-F0-plantilla-base-de-tests.pdf"}, {"nombre": "F0-plantilla-base-de-tests.csv", "tipo": "CSV", "nota": "Las mismas 12 columnas listas para pegar en Google Sheets o Notion.", "estado": "listo", "ruta": "adjuntos-skool/1-bienvenido/L07-F0-plantilla-tests.csv"}], "pantallaReal": "La plantilla de tests abierta en Google Sheets, rellenando una fila V1 campo a campo en directo."}, {"id": "L8", "emoji": "🧭", "titulo": "Tu roadmap de 90 días", "duracion": "5-8 min", "descripcion": "Te llevas el mapa completo de tus 90 días, semana a semana, para saber en todo momento si lo que te está pasando es normal o es una alarma.\n\n**En esta lección:**\n- El recorrido de S1 a S13 y por qué las fases se solapan a propósito: vendes y entregas a la vez.\n- Los 6 hitos maestros, con el primer cliente como rango honesto (S7-S10), no como fecha prometida.\n- Normal vs alarma: antes de preocuparte por resultados, audita actividad.\n- El estándar en captación: tu día es conseguir reuniones y cerrarlas.\n\n**Tu acción ahora:** descarga el roadmap, imprímelo o cópialo donde lo veas a diario, escribe la fecha real de tu S1 y calcula las fechas de tus 6 hitos maestros. Cada domingo marcas la casilla de la semana cumplida.\n\n**KPI:** las fechas de tus 6 hitos maestros calculadas y escritas en el roadmap.", "adjuntos": [{"nombre": "F0-roadmap-90-dias.pdf", "tipo": "PDF", "nota": "Mapa S1-S13 con los 6 hitos maestros, la tabla normal/alarma y checkboxes semanales.", "estado": "listo", "ruta": "adjuntos-skool/1-bienvenido/L08-F0-roadmap-90-dias.pdf"}], "pantallaReal": ""}, {"id": "L9", "emoji": "🛠️", "titulo": "Setup de tu negocio", "duracion": "8-12 min", "descripcion": "Al terminar tienes el negocio montado: nombre, dominio, email profesional, cobros y agenda. Ninguna excusa operativa para no vender.\n\n**En esta lección:**\n- El nombre en 10 minutos y el dominio + email profesional: nunca vendas desde un @gmail.com.\n- Tu método de pago (Stripe recomendado; vale cualquiera que envíe enlaces de pago y guarde la tarjeta), con la casilla que hace posible tu retainer.\n- El calendario de reservas bien configurado y la lista de lo que NO montar todavía (logo, web, SL, oficina).\n\n**Tu acción ahora:** descarga la checklist de setup, bloquea una tarde en tu calendario esta misma semana y complétala en orden.\n\n**KPI:** negocio operativo en ≤7 días — enlace de pago de prueba pagado y una reserva de test en tu calendario como comprobante.", "adjuntos": [{"nombre": "F0-checklist-setup-negocio.pdf", "tipo": "PDF", "nota": "Los 6 pasos en orden con tiempos, el bloque de lo que NO montar y el comprobante final.", "estado": "listo", "ruta": "adjuntos-skool/1-bienvenido/L09-F0-checklist-setup-negocio.pdf"}], "pantallaReal": "Claude generando 20 nombres y filtrándolos en directo; alta en Google Workspace con el dominio recién comprado; Stripe creando el enlace de pago con zoom en «guardar datos de pago para uso futuro»; Cal.com configurando disponibilidad, intervalos de 15 min y antelación mínima, más una reserva de prueba de principio a fin."}]}, {"codigo": "F1", "nombreCurso": "F1 | Domina — nicho, oferta y precio", "palabraTarjeta": "Domina", "descripcionCurso": "Eliges el micro-nicho donde vas a ser el rey, conoces a tu cliente ideal mejor que él mismo y le pones matemática a tu precio. Sales con tu oferta V1 redactada y fechada: el hito maestro de la semana 3.", "semanas": "Semanas 2-3", "lecciones": [{"id": "L1", "emoji": "🎯", "titulo": "El juego al que juegas: mercado > oferta > venta", "duracion": "5-8 min", "descripcion": "Sales de aquí sabiendo cuál es la palanca nº1 de tu negocio y con la frase del hueco que vas a explotar durante 90 días escrita.\n\n**En esta lección:**\n- La jerarquía que ordena todo: mercado > fuerza de la oferta > persuasión.\n- Por qué 9 de cada 10 veces que no cierras no es tu habilidad de venta: es tu oferta.\n- Tu casilla ganadora: mercado normal + oferta buena + ventas mediocres = éxito.\n- El hueco entre \"sé que necesito IA\" y \"no sé cómo\", y el mapa del módulo: nicho → avatar → oferta → precio.\n\n**Tu acción ahora:** piensa en 3 negocios reales de tu entorno (el dentista de tu barrio, la gestoría de tu cuñado, el taller de tu calle) y completa para cada uno la frase: \"[negocio] sabe que necesita IA para [problema], pero no sabe cómo — ahí entro yo\". Escribe la que más te convenza en la sección 1 de tu cuaderno de F1 y publícala en la comunidad.\n\n**KPI:** frase del hueco publicada en la comunidad (o escrita en tu cuaderno si aún no la quieres compartir), con un tipo de negocio real y un problema concreto.", "adjuntos": [{"nombre": "F1-cuaderno-f1.pdf", "tipo": "PDF", "nota": "Tu cuaderno del módulo; hoy rellenas la sección 1, \"El hueco de mi mercado\".", "estado": "listo", "ruta": "adjuntos-skool/2-domina/L01-F1-cuaderno-f1.pdf"}], "pantallaReal": ""}, {"id": "L2", "emoji": "🧰", "titulo": "Tu inventario de ventajas", "duracion": "6-10 min", "descripcion": "Mañana eliges el tablero donde vas a jugar 90 días. Hoy miras con qué cartas juegas, porque casi todo el mundo se salta este paso y elige el nicho de moda en vez del nicho donde tiene ventaja.\n\n**En esta lección:**\n- Una herramienta es algo que sabes usar; una habilidad es algo que sabes conseguir. Claude Code lo tendrán todos en dos semanas: entender por dónde pierde pacientes una clínica, no.\n- Inventario de hechos y no de etiquetas: «trabajé en administración» no vale; «sé dónde aparecen los duplicados y los pendientes», sí.\n- Tus seis cajones: habilidades, conocimiento del sector, capacidades técnicas, acceso, prueba y energía.\n- La matriz de 6 factores que convierte todo eso en 1-3 candidatos a micro-nicho puntuados.\n- Si no tienes experiencia laboral: no se para el programa, se construye la evidencia en paralelo.\n\n**Tu acción ahora:** rellena el inventario entero y sal con entre 1 y 3 candidatos puntuados en la matriz. Ojea el catálogo de oportunidades antes de puntuar el factor «automatizable».\n\n**KPI:** inventario relleno y 1-3 candidatos puntuados con su total — los únicos que entran en la checklist de la próxima lección.", "adjuntos": [{"nombre": "F1-inventario-ventajas.pdf", "tipo": "PDF", "nota": "Inventario de hechos, los seis cajones de activos, la matriz de 6 factores y tu frase de ventaja.", "estado": "falta"}, {"nombre": "F1-catalogo-oportunidades.pdf", "tipo": "PDF", "nota": "Las 8 capas de cualquier automatización, dónde mirar en cada tipo de negocio y cuándo NO automatizar todavía.", "estado": "falta"}], "pantallaReal": "El worksheet inventario-ventajas abierto, recorriendo las columnas de la tabla de hechos y rellenando la matriz para dos candidatos."}, {"id": "L3", "emoji": "📍", "titulo": "Micro-nicho: elige dónde ser el rey", "duracion": "8-12 min", "descripcion": "Hoy no sales \"casi\" decidido: sales con tu micro-nicho elegido, escrito y firmado.\n\n**En esta lección:**\n- Industria ≠ nicho: \"salud\" es industria; \"clínicas dentales en España que atienden +20 pacientes al día\" es micro-nicho.\n- Las 5 creencias que te frenan, desmontadas una a una (saturación, dinero, nicho perfecto, no sé del sector, idea única).\n- La matemática que tranquiliza: con 1-3 clientes cumples la promesa, y en España hay miles de negocios en cada micro-nicho.\n- Anteojeras de 90 días y regla 300/30: la única puerta de salida legítima.\n\n**Tu acción ahora:** abre la lista de 12 micro-nichos, escoge de 1 a 3 candidatos, pásalos por la checklist de validación y elige UNO. Rellena el bloque de decisión final con fecha y firma.\n\n**KPI:** checklist completada con las 5 preguntas eliminatorias en \"sí\", nombre del micro-nicho escrito y firma de anteojeras 90 días con fecha.", "adjuntos": [{"nombre": "F1-lista-micro-nichos.pdf", "tipo": "PDF", "nota": "12 micro-nichos españoles con su dolor nº1, la solución de IA típica y cómo llegar al decisor."}, {"nombre": "F1-checklist-validacion-nicho.pdf", "tipo": "PDF", "nota": "5 preguntas eliminatorias + 3 de ajuste y el bloque de decisión final con firma.", "estado": "listo", "ruta": "adjuntos-skool/2-domina/L03-F1-checklist-validacion-nicho.pdf"}], "pantallaReal": "Scroll lento por el PDF de la lista de 12 micro-nichos y después por la checklist de validación. Segundo momento opcional: Google Maps buscando el nicho candidato en 3 ciudades para el conteo."}, {"id": "L4", "emoji": "👤", "titulo": "Tu cliente ideal: conócelo mejor que él mismo", "duracion": "8-12 min", "descripcion": "Cobras en proporción a lo bien que entiendes tu mercado. Hoy conviertes ese entendimiento en un documento con los 3 momentos de dolor de tu cliente marcados.\n\n**En esta lección:**\n- Por qué el avatar abarata todo lo que viene: captación en F3 y llamadas en F4.\n- Parte 1 del worksheet: el dueño (cómo habla, qué le falló ya, su objeción nº1 ante la IA) y el negocio (quién coge el teléfono, qué mide y qué no).\n- Parte 2, el día en la vida: la tabla horaria con columna \"dolor\" y los 3 momentos donde entra tu solución.\n- Quién es quién en el negocio: quien paga, quien lo usa cada día y quien puede bloquear la compra.\n- La brecha: cómo está hoy, cómo debería estar, qué cuesta la diferencia y en qué unidad se mide — más el disparador de compra.\n- Investigación real en dos tardes: llamar como cliente, leer reseñas de Google, mirar foros del gremio y preguntar a contactos del sector.\n\n**Tu acción ahora:** rellena hoy a lápiz el worksheet entero con los 3 dolores marcados y su brecha medida, agenda en tu calendario las dos tardes de investigación y, antes de abrir L4, copia al worksheet 5 quejas literales de reseñas de Google.\n\n**KPI:** hoy, avatar y día-en-la-vida a lápiz con los 3 momentos de dolor marcados y las 2 tardes agendadas; antes de L4, las 5 quejas literales copiadas.", "adjuntos": [{"nombre": "F1-avatar-cliente-ideal.pdf", "tipo": "PDF", "nota": "Worksheet en dos partes: avatar del dueño y del negocio + tabla del día en su vida.", "estado": "listo", "ruta": "adjuntos-skool/2-domina/L04-F1-avatar-cliente-ideal.pdf"}], "pantallaReal": "Worksheet avatar-cliente-ideal abierto recorriendo los campos de la Parte 1; y reseñas reales de Google de 5-10 negocios locales con las quejas subrayadas, con nombre, logo y datos difuminados."}, {"id": "L5", "emoji": "🌉", "titulo": "Anatomía de una oferta irresistible", "duracion": "8-12 min", "descripcion": "Nadie compra el vuelo: compra las palmeras. Sales con las 3 frases de resultado de tu oferta escritas y sin una sola palabra de ingeniero.\n\n**En esta lección:**\n- La oferta como puente entre el estado actual de tu cliente y el que desea.\n- La ecuación de valor de Hormozi y las 4 palancas que mueve cada decisión de tu oferta.\n- Los 7 componentes: resultado medible, plazo, método, garantía, precio, cualificación y urgencia.\n- El error que mata a la mayoría de agencias de IA: usar la IA para construir tu oferta.\n\n**Tu acción ahora:** coge los 3 momentos de dolor de tu día-en-la-vida de L3 y escribe, para cada uno, una frase de resultado (nada de \"sistema\", \"automatización\" ni nombres de herramientas). Pásales el test del mecanismo y guárdalas en la sección 2 de tu cuaderno de F1. El worksheet de oferta solo se presenta hoy: se rellena en L7.\n\n**KPI:** 3 frases de resultado escritas en tu cuaderno, una por momento de dolor, y las tres pasan el test del mecanismo — cero nombres de tecnología.", "adjuntos": [{"nombre": "F1-cuaderno-f1.pdf", "tipo": "PDF", "nota": "Sección 2, \"3 frases de resultado\" (ya descargado en L1).", "estado": "repetido", "ruta": "ya subido en L1"}], "pantallaReal": "Scroll rápido de unos 15 s por el worksheet de oferta, solo para presentarlo, avisando expresamente de no rellenarlo aún."}, {"id": "L6", "emoji": "🪜", "titulo": "La trampa del aprendiz y tu escalera", "duracion": "6-10 min", "descripcion": "El error nº1 del principiante no es cobrar poco: es cobrar demasiado, demasiado pronto. Hoy aceptas la escalera que lo evita y defines tu piloto.\n\n**En esta lección:**\n- La trampa del aprendiz y sus tres consecuencias: devoluciones, promesas infladas y cero presión por aprender.\n- Por qué el piloto se cobra siempre y nunca es gratis: mata curiosos, genera compromiso y te da tu primer caso de éxito.\n- La escalera piloto → proyecto → retainer: la confianza, el trabajo y el cobro de todos los meses.\n- Cuándo se suben precios: con casos y datos, nunca con ansiedad — carrera al fondo vs ciclo premium, y por qué el precio prémium necesita una buena oferta y un micro-nicho detrás.\n\n**Tu acción ahora:** con tu día-en-la-vida delante, escribe en tu cuaderno de F1 la frase de tu piloto: \"[dolor concreto de mi avatar] resuelto en [X días] para [mi micro-nicho]\", y debajo la solución del catálogo que lo ejecuta, cruzando ese dolor con la columna de soluciones de la lista de micro-nichos.\n\n**KPI:** frase del piloto escrita (dolor + plazo en días + micro-nicho) y la solución del catálogo elegida, lista para ponerle precio en L6.", "adjuntos": [{"nombre": "F1-cuaderno-f1.pdf", "tipo": "PDF", "nota": "Sección 3, \"Mi piloto\" (ya descargado en L1). Esta lección no tiene descarga nueva.", "estado": "repetido", "ruta": "ya subido en L1"}, {"nombre": "F1-avatar-cliente-ideal.pdf", "tipo": "PDF", "nota": "Para releer los 3 momentos de dolor del día-en-la-vida (ya descargado en L3).", "estado": "repetido", "ruta": "ya subido en L4"}, {"nombre": "F1-lista-micro-nichos.pdf", "tipo": "PDF", "nota": "Para cruzar tu dolor con la columna de soluciones del catálogo (ya descargado en L2)."}], "pantallaReal": ""}, {"id": "L7", "emoji": "🧮", "titulo": "La matemática de tu precio", "duracion": "10-14 min", "descripcion": "Sales de aquí con tres números decididos —piloto, proyecto y retainer— derivados de una división, no de tu miedo ni de mirar a la competencia.\n\n**En esta lección:**\n- La regla de oro 5x: tu techo de precio es el valor que generas dividido entre cinco.\n- Las dos vías para estimar el valor: horas ahorradas × coste/hora, o unidades recuperadas × ticket × tasa de cierre.\n- El ejemplo dental completo, con cifras ilustrativas: 4.000€/mes → ÷5 → 800€ → 9.200€ el año 1 → ROI 5,2x.\n- Las tres zonas de ROI (fuga, sólida, fan), los rangos del programa y por qué nunca compites bajando precio.\n\n- Tu suelo: lo que te cuesta entregar más tu margen. Si el suelo sube por encima del techo, ese trabajo no tiene negocio dentro.\n\n**Tu acción ahora:** abre la calculadora y rellénala entera con tu nicho y tu solución: valor mensual, techo, tus tres precios y la comprobación de zona. Si tu techo no llega ni a entrar en los rangos, el problema no es el precio: vuelve hoy mismo a la checklist de L2.\n\n**KPI:** calculadora rellena y guardada, con los tres precios dentro de los rangos del programa y ROI del cliente comprobado ≥5x.", "adjuntos": [{"nombre": "F1-calculadora-pricing.pdf", "tipo": "PDF", "nota": "Calculadora en dos versiones: el ejemplo dental relleno y la tuya en blanco.", "estado": "listo", "ruta": "adjuntos-skool/2-domina/L07-F1-calculadora-pricing.pdf"}], "pantallaReal": "La calculadora de pricing rellenándose casilla a casilla, en directo, con las cifras del ejemplo dental (documento real del alumno, no una slide)."}, {"id": "L8", "emoji": "✍️", "titulo": "Construye tu oferta V1 — en directo", "duracion": "12-18 min", "descripcion": "La demo del módulo: construyo una oferta entera delante de ti con el mismo worksheet que vas a rellenar tú. Cuando acabe el vídeo, tu oferta V1 existe, en un documento y con fecha.\n\n**En esta lección:**\n- Los 8 pasos del worksheet en pantalla y sin cortes: quién, resultado medible, método, plazo, garantía, cualificación, precio y urgencia.\n- La plantilla del programa: \"Ayudo a [nicho] a [resultado medible], con [método en 3-4 palabras] funcionando en 7 días o menos, empezando con un piloto de [alcance acotado]\".\n- El test de la abuela y por qué \"número\" significa unidad contable, no cifra garantizada.\n- La galería de ejemplos diseccionada por componente, y qué significa que sea una V1.\n\n**Tu acción ahora:** rellena el worksheet entero con tu nicho y los precios de tu calculadora de L6, pasa el test de la abuela y marca la casilla \"Oferta V1 terminada\" con la fecha de hoy.\n\n**KPI:** oferta V1 redactada con la plantilla y casilla \"Oferta V1 terminada\" marcada con fecha — el hito maestro de la semana 3.", "adjuntos": [{"nombre": "F1-worksheet-oferta.pdf", "tipo": "PDF", "nota": "Los 8 pasos hasta la frase de tu oferta, con la casilla final fechada.", "estado": "listo", "ruta": "adjuntos-skool/2-domina/L08-F1-worksheet-oferta.pdf"}, {"nombre": "F1-ejemplos-ofertas.pdf", "tipo": "PDF", "nota": "8 ofertas de ejemplo con su desglose: para calibrar la tuya, no para copiar.", "estado": "listo", "ruta": "adjuntos-skool/2-domina/L08-F1-ejemplos-ofertas.pdf"}, {"nombre": "F1-calculadora-pricing.pdf", "tipo": "PDF", "nota": "De ahí copias los tres precios del Paso 7 (ya descargado en L6).", "estado": "repetido", "ruta": "ya subido en L7"}], "pantallaReal": "LA demo del módulo: worksheet-oferta en blanco a pantalla completa con el cursor parpadeando, y después rellenándose campo a campo en directo y sin cortes (6-8 min, los 8 pasos). Al final, la galería ejemplos-ofertas abierta subrayando cada frase con un color por componente."}, {"id": "L9", "emoji": "🔗", "titulo": "De la oferta al resto del negocio", "duracion": "6-8 min", "descripcion": "Tienes tu oferta escrita. Ese folio decide los próximos setenta días: a quién buscas, qué escribes en tus anuncios, qué enseñas en tus llamadas, qué construyes en F2 y qué firmas con tu primer cliente. Hoy compruebas que aguanta.\n\n**En esta lección:**\n- La regla de coherencia: si no puedes decir de qué parte de tu oferta salió una idea, es ruido con buena letra.\n- Qué produce cada componente: tu lista de captación, tus ganchos, tu VSL, tu demo, tus objeciones y tu entrega.\n- La revisión de 14 criterios y cómo se lee la puntuación — con el aviso de que no sustituye al mercado.\n- Deriva tus tres primeros activos sin inventar nada: un gancho, una pregunta de diagnóstico y un seguimiento.\n\n**Tu acción ahora:** puntúa tu oferta con la ficha de revisión, arregla hoy los criterios que hayas puesto a 0 y escribe los tres activos derivados en el mismo documento.\n\n**KPI:** revisión puntuada con su total, cero criterios en 0 y los 3 activos redactados.", "adjuntos": [{"nombre": "F1-revision-oferta.pdf", "tipo": "PDF", "nota": "Los 14 criterios con su lectura de puntuación, la tabla de derivación oferta → activo y los tres primeros activos a redactar.", "estado": "falta"}], "pantallaReal": "La ficha de revisión rellenándose criterio a criterio y el worksheet de oferta al lado, para señalar de dónde sale cada activo."}]}, {"codigo": "F2", "nombreCurso": "F2 | Construye — Claude Code y tu demo", "palabraTarjeta": "Construye", "descripcionCurso": "Montas tu stack, aprendes a dirigir a Claude Code y construyes la solución que promete tu oferta. Sales con tu demo desplegada en una URL, su guion de 3 minutos y el vídeo de respaldo grabado.", "semanas": "Semanas 3-4", "lecciones": [{"id": "L1", "emoji": "🧭", "titulo": "Tu arsenal: por qué Claude Code lo cambia todo", "duracion": "5-8 min", "descripcion": "Sales de esta lección sabiendo qué es Claude Code, por qué es tu ventaja competitiva y cuál es tu papel: director, no programador.\n\n**En esta lección:**\n- Qué es Claude Code en lenguaje de resultado —un desarrollador senior por el coste orientativo de una suscripción— y la vacuna anti-magia: se equivoca, y corrige en minutos.\n- La inversión de papeles: describir, revisar y decidir. Tú diriges; la máquina teclea. No vas a programar ni hoy ni en la semana 12.\n- Por qué construir en días es lo que hace irresistible tu oferta V1: piloto acotado, rápido y con el riesgo del cliente casi a cero.\n- El mapa de las seis paradas de F2 y el estándar de la casa: simple y entregado gana a complejo y eterno.\n\n**Tu acción ahora:** L2 es práctica pura y necesita foco. Reserva en tu calendario una tarde de esta semana —tres horas seguidas, sin móvil— para montar tu stack, y anúnciala en la comunidad para comprometerte en público.\n\n**KPI:** tarde de setup reservada en el calendario y anunciada en la comunidad, con día y hora concretos.", "adjuntos": [], "pantallaReal": "Grabación acelerada de Claude Code construyendo una página entera sin que nadie toque el teclado, y la demo web dental funcionando en el navegador (mitad derecha del gancho)."}, {"id": "L2", "emoji": "🛠️", "titulo": "Setup del stack en una tarde", "duracion": "10-15 min", "descripcion": "Al terminar tienes software tuyo publicado en internet, en una URL que puedes enseñar hoy mismo. Aunque nunca hayas abierto un terminal.\n\n**En esta lección:**\n- El terminal desdramatizado: una ventana donde das órdenes con texto. Usarás cuatro cosas contadas, no vas a memorizar comandos.\n- Las cuatro piezas de tu stack y lo que cuestan de verdad: Claude Code construye, GitHub guarda, Vercel publica, Supabase espera su turno.\n- Instalación paso a paso en macOS y en Windows, cuentas de GitHub y Vercel, y tu primera conversación con Claude Code.\n- Tu «hola mundo» con el nombre de tu agencia, desplegado y abierto en el móvil. Y el gesto para cuando algo falle: copiar el error entero y pegárselo.\n\n**Tu acción ahora:** abre la checklist de setup, complétala casilla a casilla de arriba abajo y no la cierres hasta la última: tu URL compartida en la comunidad.\n\n**KPI:** URL del «hola mundo» desplegada y publicada en la comunidad.", "adjuntos": [{"nombre": "F2-checklist-setup-stack.pdf", "tipo": "PDF", "nota": "Los 7 pasos con su tiempo estimado, la orden copiable del hola mundo, los atascos típicos y los costes orientativos.", "estado": "listo", "ruta": "adjuntos-skool/3-construye/L02-F2-checklist-setup-stack.pdf"}], "pantallaReal": "Instalación de Claude Code en macOS y en Windows, terminal arrancando por primera vez, alta en GitHub y en Vercel, y el deploy del hola mundo con la URL abierta en ordenador y en móvil."}, {"id": "L3", "emoji": "🎯", "titulo": "Cómo dirigir a Claude Code", "duracion": "10-14 min", "descripcion": "Te llevas la habilidad de la que vive todo este negocio: escribir briefs que producen exactamente lo que quieres, e iterar sin romper lo que ya funciona.\n\n**En esta lección:**\n- La regla de oro: describe QUÉ debe pasar y PARA QUIÉN, nunca CÓMO programarlo. Si sabes explicárselo a un becario brillante, sabes construir software.\n- La plantilla de brief del programa: seis secciones fijas, con la lista numerada de comportamientos observables como corazón.\n- CLAUDE.md, las reglas fijas de tu proyecto: el manual de bienvenida del becario, que se da una vez y no se repite cada mañana.\n- Pasos pequeños —una petición = un cambio, probar antes de pedir el siguiente— y los 5 errores del no-técnico, para conocerlos antes de cometerlos.\n\n**Tu acción ahora:** abre la plantilla de brief, lee entero el ejemplo dental y rellena tu brief V1 con TU solución, la que promete tu oferta V1 de F1.\n\n**KPI:** brief V1 escrito con las 6 secciones completas —ninguna en blanco— y la lista de comportamientos observables numerada.", "adjuntos": [{"nombre": "F2-plantilla-brief-solucion.pdf", "tipo": "PDF", "nota": "Las 6 secciones del brief para rellenar, el ejemplo dental completo como patrón de calidad y las 3 reglas de dirección.", "estado": "listo", "ruta": "adjuntos-skool/3-construye/L03-F2-plantilla-brief-solucion.pdf"}], "pantallaReal": "La plantilla de brief abierta y recorrida con el cursor por sus 6 secciones, y un CLAUDE.md real de la demo dental (6-8 líneas de reglas) en el editor."}, {"id": "L4", "emoji": "📚", "titulo": "El catálogo por dentro", "duracion": "8-12 min", "descripcion": "Sales sabiendo qué hay técnicamente dentro de cada una de las 8 soluciones y con la tuya confirmada por escrito: la que promete tu oferta V1.\n\n**En esta lección:**\n- Rayos X: toda solución son tres piezas —una cara, un cerebro y una memoria— y algunas piden una cuarta, la integración.\n- DEMO vs PILOTO REAL, la distinción que te ahorra semanas: la demo web simula el flujo y se construye ahora; las integraciones de verdad esperan a F5, con un cliente pagando.\n- Las ocho fichas por familias —agenda y teléfono, leads, papeleo, reputación— con su dificultad y su potencia de demo.\n- La matriz y la esquina de oro (dificultad 1 · potencia 3): orienta, pero la que manda es tu oferta.\n\n**Tu acción ahora:** abre el catálogo, lee entera la ficha de TU solución y anota qué va a simular exactamente tu demo.\n\n**KPI:** solución elegida y publicada en la comunidad: nombre canónico del catálogo + una frase con lo que simulará tu demo.", "adjuntos": [{"nombre": "F2-catalogo-tecnico-soluciones.pdf", "tipo": "PDF", "nota": "Las 8 fichas técnicas comparables y la matriz dificultad × potencia de demo con la esquina de oro.", "estado": "listo", "ruta": "adjuntos-skool/3-construye/L04-F2-catalogo-tecnico-soluciones.pdf"}], "pantallaReal": ""}, {"id": "L5", "emoji": "🎬", "titulo": "DEMO EN DIRECTO: construye tu solución", "duracion": "15-20 min", "descripcion": "Ves construir una demo completa de principio a fin —del brief a la URL abierta en el móvil— y la replicas con tu solución y tu nicho. Esta lección se trabaja, no se mira.\n\n**En esta lección:**\n- Los cinco pasos del ciclo, en directo y sin cortes: brief → construir → romper y arreglar → dos mejoras → deploy.\n- El brief rellenado en dos minutos sobre la demo dental de recuperación de citas: panel, simulador del flujo y datos del nicho.\n- El primer fallo, provocado a propósito y arreglado pegando el error. No es un tropiezo: es EL método.\n- Freno deliberado: dos mejoras y paramos. El estándar de hoy es fea pero funcionando y en una URL.\n\n**Tu acción ahora:** rellena la plantilla de brief con tu solución y tu nicho, y ejecuta los cinco pasos hasta tener una URL que abre en tu móvil.\n\n**KPI:** tu demo V1 construida y desplegada en una URL — aunque sea fea.", "adjuntos": [{"nombre": "F2-plantilla-brief-solucion.pdf", "tipo": "PDF", "nota": "La misma plantilla, ahora para tu build (ya descargado en L3).", "estado": "repetido", "ruta": "ya subido en L3"}], "pantallaReal": "El build completo de la demo dental: rellenar el brief, pegarlo en Claude Code y verlo construir, la primera versión en el navegador, el fallo provocado y arreglado pegando el error, las dos iteraciones (datos realistas y toque visual), el deploy y la URL recorrida en el móvil en mano."}, {"id": "L6", "emoji": "🧪", "titulo": "Testea como un profesional", "duracion": "6-10 min", "descripcion": "Sales con una demo a prueba de directo: la rompes tú, con método y checklist, antes de que la rompa un cliente.\n\n**En esta lección:**\n- Testear es la última fase de construir, no un extra para perfeccionistas. Tu demo se romperá donde tú decidas: hoy contigo, gratis, o el jueves en la llamada, carísimo.\n- Los checks de la checklist pre-demo: flujo completo tres veces, probada EN MÓVIL, datos realistas del nicho, entradas raras y carga rápida.\n- El test del cuñado: alguien sin ningún contexto usa tu demo delante de ti mientras tú callas y apuntas.\n- Claude Code como tu primer probador —pídele casos límite— y su límite honesto: no ve la cara de confusión de un humano.\n\n**Tu acción ahora:** pasa hoy la checklist entera con tu demo de L5: los cinco checks técnicos, la sesión de casos límite con Claude Code y el test del cuñado, con nombre y fecha apuntados.\n\n**KPI:** checklist pre-demo con los checks técnicos y el test del cuñado marcados —nombre y fecha incluidos— sobre tu demo V1.", "adjuntos": [{"nombre": "F2-checklist-pre-demo.pdf", "tipo": "PDF", "nota": "Los 5 checks técnicos, el test del cuñado y el sello «apta para enseñar» con firma y fecha.", "estado": "listo", "ruta": "adjuntos-skool/3-construye/L06-F2-checklist-pre-demo.pdf"}], "pantallaReal": "La demo dental de L5 recorriéndose para ilustrar cada check (flujo completo, móvil con datos, entradas raras) y Claude Code generando la lista de casos límite."}, {"id": "L7", "emoji": "🏁", "titulo": "Tu demo vendible", "duracion": "8-12 min", "descripcion": "Cierras F2 con tu activo de venta completo: demo desplegada en tu URL, guion de presentación de 3 minutos escrito y vídeo de respaldo grabado.\n\n**En esta lección:**\n- De demo técnica a activo de venta con dos retoques que no requieren construir nada: datos verosímiles del nicho y un flujo que cuenta una historia con principio, nudo y desenlace.\n- El guion de 3 minutos: el dolor en SUS palabras → «mira esto» → el resultado en unidad contable y el siguiente paso. Sin precio: eso es materia de F4.\n- El vídeo de respaldo de 2-3 minutos: tu paracaídas si la wifi se cae en llamada, y material de funnel en F3.\n- Dónde vive tu demo a partir de hoy: una URL compartible que es tu credencial —«no me creas, míralo funcionar»—.\n\n**Tu acción ahora:** rellena el guion entero con tu nicho y las reseñas de F1-L4, ensáyalo en voz alta cronometrado y graba el vídeo de respaldo con tu grabador de pantalla.\n\n**KPI:** el hito maestro de F2 — demo desplegada en URL + guion de 3 minutos escrito + vídeo de respaldo grabado, los tres publicados en la comunidad.", "adjuntos": [{"nombre": "F2-guion-demo-3-min.pdf", "tipo": "PDF", "nota": "Los tres minutos como línea de tiempo rellenable, con la tabla de 5 pasos del minuto 2.", "estado": "listo", "ruta": "adjuntos-skool/3-construye/L07-F2-guion-demo-3-min.pdf"}], "pantallaReal": "La misma demo antes y después de los datos verosímiles («Cliente 1 / Cita 3» → Marta Ruiz y su cita cancelada) y la grabación del vídeo de respaldo con un grabador de pantalla."}]}, {"codigo": "F3", "nombreCurso": "F3 | Lanza — máquina de demanda", "palabraTarjeta": "Lanza", "descripcionCurso": "Enciendes el grifo: funnel, VSL, anuncios B2B y outreach en frío hasta que caigan reuniones en tu calendario. Hito del módulo: tus primeras reuniones agendadas.", "semanas": "Semanas 5-7", "lecciones": [{"id": "L1", "emoji": "⚙️", "titulo": "La máquina de demanda", "duracion": "6-9 min", "descripcion": "Sales de aquí con un número: los toques diarios que te separan de tus primeras reuniones y lo que vale cada uno en euros.\n\n**En esta lección:**\n- Por qué sin tráfico tu oferta de F1 y tu demo de F2 valen exactamente cero.\n- Tu ruta según presupuesto: outreach orgánico, outreach sistematizado o Meta ads — las tres desembocan en el mismo funnel.\n- La matemática de actividad hacia atrás: objetivo → clientes → reuniones realizadas → agendadas → toques al día.\n- La regla de la muestra: 300 toques antes de emitir un veredicto sobre tu canal.\n\n**Tu acción ahora:** copia el tracker a tu Sheets o Notion y rellena la matemática de actividad con tu calculadora de F1 — clientes, reuniones, toques al día y el valor en euros de cada toque, escrito donde lo veas cada mañana. Y con reloj propio: crea hoy tu página de Facebook/Instagram y deja configurada la campaña de calentamiento (L4), porque ese reloj corre en paralelo.\n**KPI:** tracker copiado y operativo + matemática de actividad completa, con tu valor por toque en euros en la primera fila.", "adjuntos": [{"nombre": "F3-tracker-captacion.csv", "tipo": "CSV", "nota": "Tu registro diario de toques y la hoja de matemática de actividad: cópialo a Sheets o Notion.", "estado": "listo", "ruta": "adjuntos-skool/4-lanza/L01-F3-matematica-actividad.csv · L01-F3-tracker-email.csv · L01-F3-tracker-llamadas.csv · L01-F3-tracker-linkedin.csv · L01-F3-tracker-ads.csv · L01-F3-tracker-creativos.csv · L01-F3-tracker-resumen-semanal.csv"}], "pantallaReal": "La demo desplegada del alumno (F2-L7) junto a un calendario vacío; el tracker abierto en Sheets/Notion."}, {"id": "L2", "emoji": "🌐", "titulo": "Tu funnel: de clic a reunión", "duracion": "10-14 min (práctica)", "descripcion": "Terminas con tu funnel publicado en URL propia y probado de punta a punta desde el móvil.\n\n**En esta lección:**\n- Las 5 piezas en orden: titular congruente, VSL, botón a tu demo, formulario de 2-4 preguntas y calendario embebido. Sin menú y sin enlaces de salida.\n- El principio de fricción: arranca con poca y añade solo cuando falle la calidad, nunca antes.\n- Construirlo con Claude Code desde un brief, con su bloque legal: privacidad, consentimiento de cookies antes del pixel y casilla en el formulario.\n- Speed to lead: aviso al móvil en cada envío y respuesta en menos de 5 minutos.\n\n**Tu acción ahora:** escribe el brief de tu funnel con la plantilla de F2-L3, constrúyelo con Claude Code y publícalo; después pasa la checklist ENTERA desde tu móvil, reserva de prueba incluida.\n**KPI:** funnel publicado en URL propia + prueba completa desde el móvil (formulario enviado → reserva de test en tu calendario) + checklist del funnel firmada.", "adjuntos": [{"nombre": "F3-checklist-funnel.pdf", "tipo": "PDF", "nota": "Las 6 comprobaciones antes de mandar tráfico, con la firma de «apto para recibir tráfico» al final.", "estado": "falta"}], "pantallaReal": "El funnel terminado recorrido en un móvil en 10 s; Claude Code construyéndolo desde el brief y publicando la primera versión; envío de formulario de prueba con el aviso llegando al móvil (cronómetro visible)."}, {"id": "L3", "emoji": "🎬", "titulo": "Tu VSL: «no me creas, míralo funcionar»", "duracion": "8-12 min", "descripcion": "Grabas con el móvil el vídeo que atiende cada visita de tu funnel mientras tú duermes.\n\n**En esta lección:**\n- Qué es un VSL y por qué multiplica el show rate (60-70% en B2B templado, benchmark del programa).\n- Los 5 bloques: a quién ayudo y su dolor · «no me creas, mira esto» con la demo en pantalla · cómo trabajo · qué pasa al agendar · CTA al calendario.\n- Producción simple: cámara del móvil, luz de ventana, fondo limpio y guion ensayado. Total, 3-5 minutos.\n- Los 4 NOs: casos inventados, salir leyendo, prometer cifras y perfeccionismo de imagen.\n\n**Tu acción ahora:** rellena los 5 bloques del guion con tu oferta y tu demo, ensáyalo en voz alta hasta que suene a ti, graba y móntalo arriba de tu funnel. Si te pasas de tiempo, recorta del bloque 3: el bloque 2 no se toca.\n**KPI:** VSL de 3-5 minutos grabado y montado arriba del funnel, comprobado desde el móvil.", "adjuntos": [{"nombre": "F3-guion-vsl.pdf", "tipo": "PDF", "nota": "Worksheet de los 5 bloques con sus tiempos orientativos y los NOs de aviso antes de grabar.", "estado": "falta"}], "pantallaReal": "El funnel de L2 en móvil con el hueco del VSL señalado y el provisional sustituyéndose; la demo funcionando como grabación de pantalla (bloque 2)."}, {"id": "L4", "emoji": "👤", "titulo": "Tu página y el calentamiento", "duracion": "6-9 min", "descripcion": "Le pones cara pública a tu negocio y dejas la cuenta calentándose sola mientras terminas el funnel y el VSL.\n\n**En esta lección:**\n- Persona > logo: de quién se fía el dueño de un negocio local, y por qué su defensa contra logos está entrenadísima.\n- Cómo se monta la página: tu nombre y apellidos como título, foto real y una bio de resultado en una línea.\n- La campaña de engagement a 5€/día: qué compras con ella y por qué abarata los CPM cuando lances en L6.\n- La advertencia: no crees página, cuenta publicitaria y campaña el mismo día — Meta restringe cuentas nuevas que corren. Y si vas por outreach, esto también es tuyo: la página es tu escaparate cuando te busquen, y te van a buscar.\n\n**Tu acción ahora:** crea la página (nombre y apellidos, foto real, bio de resultado) y deja configurada la campaña de engagement a 5€/día, repartiendo los pasos en días distintos si tu cuenta publicitaria es nueva.\n**KPI:** página creada + campaña de engagement activa a 5€/día (captura de ambas en la comunidad).", "adjuntos": [], "pantallaReal": "Creación de la página de Facebook/Instagram paso a paso (nombre, foto, bio); administrador de anuncios configurando la campaña de engagement a 5€/día."}, {"id": "L5", "emoji": "🖼️", "titulo": "Anatomía de un anuncio B2B", "duracion": "10-14 min", "descripcion": "No sales de esta lección sin tus primeros creativos hechos y el copy de cada uno escrito.\n\n**En esta lección:**\n- Las 4 piezas del anuncio —oferta, creativo, copy y destino— y la regla del 80/80: el creativo es el 80% del resultado y, dentro del creativo, el hook es el 80%.\n- La oferta del ad vende la reunión, no el proyecto: resultado concreto + prueba verificable + un paso pequeño.\n- Niveles de consciencia: tu dueño es consciente del problema pero no conoce el vehículo — enséñale el resultado en SU sector y acompáñalo de la demo.\n- Los 3 conceptos de creativo (tu cara, captura real de tu demo, antes/después), la fórmula de copy y la biblioteca de anuncios de Meta: inspirarse, no copiar.\n\n**Tu acción ahora:** genera tus 2-4 creativos con los prompts del banco mezclando conceptos —no el mismo con otro color— y escribe el copy de cada uno con la fórmula nicho → dolor → resultado → CTA.\n**KPI:** 2-4 creativos generados + copy escrito para cada uno (lote publicado en la comunidad).", "adjuntos": [{"nombre": "F3-banco-creativos-b2b.pdf", "tipo": "PDF", "nota": "Los prompts completos de los 3 conceptos, la fórmula de copy con ejemplos y la guía de la biblioteca de anuncios.", "estado": "falta"}], "pantallaReal": "Generador de imágenes produciendo un creativo con el prompt del recurso; biblioteca de anuncios de Meta (facebook.com/ads/library) filtrando veteranos activos."}, {"id": "L6", "emoji": "🚀", "titulo": "Lanza tu campaña", "duracion": "12-16 min", "descripcion": "Hoy pulsas el botón: estructura montada, pixel probado y lanzamiento programado.\n\n**En esta lección:**\n- La estructura mínima 1 campaña → 1 adset → 2-4 creativos, a 30-50€/día (mínimo absoluto 20€/día) y 10-20€/día por creativo.\n- Targeting 2026: tu creativo ES el targeting. Solo configuras edad, ubicación y placements — Facebook e Instagram, nada más.\n- Evento de optimización y pixel instalado con Claude Code de un prompt, y comprobado por ti en el administrador de eventos: sin ese check no hay lanzamiento.\n- La checklist pre-lanzamiento de 6 puntos, el arranque a las 00:00 y la parte difícil: 7 días sin tocar nada.\n\n**Tu acción ahora:** completa la checklist pre-lanzamiento punto por punto, programa la campaña para las 00:00 y publica la checklist marcada en la comunidad. Esta semana solo haces dos cosas: responder cada lead en menos de 5 minutos y apuntar los datos una vez al día. Si tu ruta es outreach, guarda la checklist: la ejecutarás igual al reinvertir tus primeros ingresos.\n**KPI (ruta ads):** campaña activa + checklist pre-lanzamiento completa publicada.", "adjuntos": [{"nombre": "F3-kpis-ads-benchmarks.pdf", "tipo": "PDF", "nota": "Aquí usas su checklist pre-lanzamiento (última página); la tabla de benchmarks se estrena en L7.", "estado": "falta"}], "pantallaReal": "Administrador de anuncios montando campaña → adset → creativos y programando el lanzamiento a las 00:00; Claude Code instalando el pixel y el administrador de eventos de Meta registrando lead y reserva en el test."}, {"id": "L7", "emoji": "📊", "titulo": "Lee los datos como un profesional", "duracion": "12-16 min", "descripcion": "Aprendes a decidir con datos —matar, mantener o escalar— en lugar de con sensaciones.\n\n**En esta lección:**\n- El tablero mínimo de seis números, una vez al día: gasto, CPM, CTR link, conversión de landing, coste por reunión agendada y por reunión realizada, cada uno con su benchmark al lado.\n- Las 5 reglas: muestra mínima (50 eventos o 5-7 días), matar a 2x del objetivo, zona intermedia, nunca editar un anuncio activo —duplica y cambia UNA variable— y escalar +20-30% cada 2-3 días.\n- La jerarquía de diagnóstico en cascada: CPM → CTR link → landing → show rate.\n- El análisis de cuellos de botella con Claude, con el prompt listo para copiar.\n\n**Tu acción ahora:** copia el prompt de análisis y pásale a Claude los datos que ya tengas en el tracker, aunque la muestra no esté completa: hoy se instala el hábito. Ruta outreach: cambian las columnas, las reglas son las mismas.\n**KPI:** tracker con 7 días de datos reales + primer análisis de cuellos de botella hecho con Claude.", "adjuntos": [{"nombre": "F3-kpis-ads-benchmarks.pdf", "tipo": "PDF", "nota": "(ya descargado en L6) Benchmarks, semáforo kill/keep/scale y el prompt de análisis.", "estado": "repetido", "ruta": "ya subido en L6"}, {"nombre": "F3-tracker-captacion.csv", "tipo": "CSV", "nota": "(ya descargado en L1) De aquí salen los 7 días de datos que le pegas a Claude.", "estado": "repetido", "ruta": "ya subido en L1"}], "pantallaReal": "El tracker de captación con los primeros 7 días de datos reales de la campaña; Claude haciendo el análisis de cuellos de botella con el prompt del recurso y las métricas pegadas."}, {"id": "L8", "emoji": "✉️", "titulo": "Email frío B2B que no da vergüenza (y cumple)", "duracion": "10-14 min", "descripcion": "Montas el canal principal de la ruta low-budget: pocos emails, muy personalizados, a una lista construida por ti.\n\n**En esta lección:**\n- Las reglas primero (LSSI/RGPD): buzones corporativos, personalización real, interés legítimo B2B, baja clara en cada email y cero bases compradas. Orientación práctica, no asesoría legal.\n- Tu lista propia: 100-300 negocios de Google Maps y sus webs, con la columna «lo que he visto» que alimenta la personalización — Claude Code hace la paliza, el criterio es tuyo.\n- La secuencia hook → pitch → seguimiento 1 → 2 → cierre, y el trabajo exacto de cada pieza.\n- Cadencia sostenible de 200-400 envíos/semana e higiene de envío; a quien responde, llamada ese mismo día.\n\n**Tu acción ahora:** adapta la secuencia a tu nicho con tu funnel enlazado, monta tu método de seguimiento, construye la lista con los criterios de F1-L3 y haz los primeros 50 envíos esta semana, registrándolos en el tracker.\n**KPI:** lista de 100+ negocios validados + secuencia adaptada + método de seguimiento montado + primeros 50 envíos hechos.", "adjuntos": [{"nombre": "F3-plantillas-email-frio.pdf", "tipo": "PDF", "nota": "La secuencia completa con los [CAMPOS] a rellenar: hook, pitch, seguimientos y cierre.", "estado": "falta"}, {"nombre": "F3-rgpd-captacion.pdf", "tipo": "PDF", "nota": "Qué sí y qué no, canal a canal. Se consulta ANTES de cada campaña, no después del susto.", "estado": "falta"}], "pantallaReal": "Hoja de cálculo con las columnas de la lista y Claude Code rellenando en lote la columna «lo que he visto» a partir de las webs; las plantillas de email abiertas rellenándose en directo."}, {"id": "L9", "emoji": "📞", "titulo": "LinkedIn y la llamada que agenda", "duracion": "10-14 min", "descripcion": "Enciendes los dos canales donde estás tú en directo: tu nombre en LinkedIn y tu voz al teléfono.\n\n**En esta lección:**\n- LinkedIn con criterio: titular = tu oferta en 8 palabras, conexión SIN pitch en el primer mensaje y la conversación que acaba llevando a tu funnel.\n- La cabeza antes de marcar: el no es gratis, es un intercambio entre dos negocios y cada llamada es un ladrillo de tu matemática de actividad.\n- Tonalidad: sonríe, baja el ritmo, cero muletillas, tú ofreces.\n- El guion en 5 pasos —apertura honesta, dolor, pregunta, puente, agenda en vivo—, las objeciones de agenda y la regla que no se negocia: reunión sin invitación aceptada = reunión que no existe.\n\n**Tu acción ahora:** reescribe tu titular de LinkedIn con tu oferta en 8 palabras, imprime el guion, ensáyalo en voz alta 5 veces y haz hoy tus 10 primeras llamadas o conexiones. Todo al tracker el mismo día.\n**KPI:** 50 llamadas O 30 conversaciones de LinkedIn registradas en el tracker.", "adjuntos": [{"nombre": "F3-guion-llamada-b2b.pdf", "tipo": "PDF", "nota": "Los 5 pasos en grande para tenerlo delante mientras marcas, más la tabla de 8 objeciones.", "estado": "falta"}, {"nombre": "F3-tracker-captacion.csv", "tipo": "CSV", "nota": "(ya descargado en L1) Aquí van llamadas, conversaciones y reuniones agendadas, el mismo día.", "estado": "repetido", "ruta": "ya subido en L1"}, {"nombre": "F3-rgpd-captacion.pdf", "tipo": "PDF", "nota": "(ya descargado en L8) La fila de llamada en frío: permitida a empresas, con matices.", "estado": "repetido", "ruta": "ya subido en L8"}], "pantallaReal": "Un perfil de LinkedIn orientado a resultado (titular, foto, acerca de con el funnel); la llamada interpretada a cámara con el calendario enviando la invitación en vivo."}, {"id": "L10", "emoji": "📅", "titulo": "El estándar: tu día en captación", "duracion": "5-8 min", "descripcion": "La lección más corta del módulo y probablemente la que más dinero te hará ganar: qué haces cada día hasta el primer cliente.\n\n**En esta lección:**\n- Una sola cosa: 80% del tiempo en captación y 20% en el resto. Tu demo no mejora en el vacío, mejora delante de dueños de negocio reales.\n- El avión: el despegue quema el 90% del combustible. Si estas semanas cuestan, no es que falle nada — es que estás despegando.\n- Tu bloque diario según ruta: datos una vez al día y producir (ads), o envíos, seguimientos y llamadas a primera hora (outreach). La reunión manda: el bloque se mueve, nunca se cancela.\n- Más, antes que mejor o nuevo: no montes el segundo canal hasta exprimir el primero.\n\n**Tu acción ahora:** crea el bloque diario de captación en tu calendario —misma hora, todos los días laborables, con recordatorio—, hazle una captura, compártela en la comunidad y cúmplelo hoy por primera vez. El día flojo también se apunta: un 0 es un dato.\n**KPI:** captura del bloque diario + 7 días seguidos cumplidos y registrados en el tracker.", "adjuntos": [{"nombre": "F3-tracker-captacion.csv", "tipo": "CSV", "nota": "(ya descargado en L1) El estándar se demuestra aquí: 7 días seguidos registrados.", "estado": "repetido", "ruta": "ya subido en L1"}], "pantallaReal": ""}]}, {"codigo": "F4", "nombreCurso": "F4 | Cierra — ventas consultivas", "palabraTarjeta": "Cierra", "descripcionCurso": "El sistema completo de la llamada de venta: del agendado que sí se presenta al piloto cobrado antes de colgar. Ocho lecciones para tu hito: tu primer cliente.", "semanas": "Semanas 6-9", "lecciones": [{"id": "L1", "emoji": "🧠", "titulo": "Por qué compran (y por qué no)", "duracion": "8-12 min", "descripcion": "Sales sabiendo por qué compra de verdad un dueño de negocio: por emoción, en el hueco entre dónde está su negocio hoy y dónde quiere que esté — y con una expectativa realista de cuántas llamadas te separan del primer cliente.\n\n**En esta lección:**\n- Comprar es un 80-90% emoción y se justifica con lógica después.\n- El gap: la llamada abre el hueco y tu oferta de F1 es el puente.\n- Las palabras pesan un 7%: tono, intención y autoimagen son el resto.\n- Cinco mitos que cuestan dinero, la tasa de cierre 20-25% y la regla de 30.\n\n**Tu acción ahora:** escribe en un papel «Mi trabajo en cada llamada es determinar si puedo ayudarle de verdad» y pégalo donde lo veas en cada reunión. Debajo, «0 / 30»: tu contador de llamadas realizadas antes de juzgar nada. Y consume F4 entero antes de tu primera reunión real.\n\n**KPI:** frase de intención escrita y visible en tu puesto de trabajo + contador 0/30 en marcha.", "adjuntos": [], "pantallaReal": ""}, {"id": "L2", "emoji": "🧘", "titulo": "Tu estado es tu herramienta", "duracion": "6-10 min", "descripcion": "Instalas el sistema que impide que una llamada mala contamine la siguiente: tres palabras ancla, tres respiraciones y una rutina diaria de revisión.\n\n**En esta lección:**\n- Quién eres fuera de la llamada es quién eres dentro: tu estado entra contigo.\n- Tu estado se contagia — el del que dirige la llamada marca el de la llamada.\n- El ejercicio de las 2 columnas y las 3 palabras ancla, antes y después de cada llamada.\n- El rechazo es ruido estadístico: observador curioso, no víctima.\n\n**Tu acción ahora:** haz entero el ejercicio de las 2 columnas de la rutina de estado —15 minutos, sin saltártelo—, elige tus 3 palabras ancla y pégalas en el borde de tu pantalla antes de cerrar la lección. Y publica hoy tu disponibilidad en la comunidad: deja agendadas tus 5 llamadas de práctica.\n\n**KPI:** 3 palabras ancla visibles en tu puesto + rutina diaria en el calendario (llamada buena AM, mala PM) + 5 llamadas de práctica agendadas.", "adjuntos": [{"nombre": "F4-rutina-estado.pdf", "tipo": "PDF", "nota": "El worksheet de las 2 columnas y las 3 palabras ancla, con el bloque recortable para el monitor.", "estado": "falta"}, {"nombre": "F4-guia-llamadas-practica.pdf", "tipo": "PDF", "nota": "Solo para ver la progresión de las 5 prácticas y ponerles fecha hoy; se trabaja entera en L8.", "estado": "falta"}], "pantallaReal": ""}, {"id": "L3", "emoji": "📅", "titulo": "Setting: que se presenten", "duracion": "10-14 min", "descripcion": "Montas la secuencia completa que va del agendado al show, y entiendes lo que casi nadie te cuenta: el show rate no lo salvan los recordatorios, se gana al agendar. Benchmark del programa: 60-70%.\n\n**En esta lección:**\n- La reunión se agenda a menos de 24-48 horas: promete 30 minutos, reserva 45.\n- El amarre antes de colgar: email letra a letra, invitación aceptada y doble compromiso verbal.\n- Tres toques humanos —pre-visionado, día antes y 45 minutos— que rompen el patrón del robot.\n- Pre-cualifica con tu formulario y responde a las 6 objeciones de agenda.\n\n**Tu acción ahora:** abre el checklist de setting, monta tu secuencia de confirmación y escribe con tus palabras tus dos mensajes humanos (día antes y 45 minutos). Aplícala a TODAS las reuniones que ya tengas agendadas esta semana.\n\n**KPI:** secuencia de confirmación aplicada al 100% de tus reuniones agendadas; objetivo de show rate ≥60% en tus próximas 10.", "adjuntos": [{"nombre": "F4-checklist-setting-show.pdf", "tipo": "PDF", "nota": "La línea agendado → show con sus casillas, para imprimir y tachar en cada agendado.", "estado": "falta"}], "pantallaReal": "Captura de móvil (WhatsApp): los dos mensajes humanos de confirmación —día antes y «¿te va bien en 45 minutos?»— frente a un recordatorio automático genérico tachado. Datos ficticios."}, {"id": "L4", "emoji": "🗺️", "titulo": "El mapa de la llamada", "duracion": "8-12 min", "descripcion": "Te llevas el mapa de las 5 fases de una llamada de venta y sabes siempre en qué punto estás y qué tiene que pasar antes de avanzar — sin guion.\n\n**En esta lección:**\n- Rapport, marco, discovery, pitch y cierre en 30-45 minutos: discovery 15-30, pitch con demo menos de 7.\n- Rapport de camaleón, empezando en el medio: ni teletienda ni apagado.\n- Los 4 tipos de energía y las señales que llegan solas en los primeros minutos.\n- El marco: quien pregunta, dirige. Y autoridad sin arrogancia con el dueño curtido.\n\n**Tu acción ahora:** haz TU copia del framework de la llamada, reescribe los dos planteamientos de marco con tus palabras y tu oferta, y deja tu framework en una sola hoja lista para la próxima llamada.\n\n**KPI:** tu copia del framework creada y adaptada + tu planteamiento de marco dicho en voz alta una vez, sin leer.", "adjuntos": [{"nombre": "F4-framework-llamada.pdf", "tipo": "PDF", "nota": "El mapa de las 5 fases en una hoja, con los 2 planteamientos de marco y la tabla de los 4 tipos de energía.", "estado": "falta"}], "pantallaReal": "B-roll corto: la hoja del framework (el PDF del recurso) abierta o impresa junto a la ventana de videollamada — como red de seguridad, no como teleprónter."}, {"id": "L5", "emoji": "🔍", "titulo": "Discovery: donde se hace la venta", "duracion": "12-16 min", "descripcion": "La lección donde se gana la venta: los 15-30 minutos de preguntas en los que el dueño pasa de contarte datos a verse en un espejo.\n\n**En esta lección:**\n- Los 3 niveles —superficie, acción, identidad— con su señal de llegada. Jamás pitchees en nivel 1.\n- La pregunta grande y los dos únicos caminos: respuesta vaga (cuantificar) o bomba de información (comportamiento).\n- Presencia y preframing: la siguiente pregunta sale de su última respuesta, no de una lista.\n- Un iceberg cada vez, caza del «más o menos», pre-manejo de objeciones y la transición sí/no/quizá.\n\n**Tu acción ahora:** estudia la guía de discovery y monta una llamada de práctica de SOLO discovery con un compañero de la comunidad: 20 minutos, su nicho real, objetivo nivel 2. Apunta qué palabras con carga aparecieron.\n\n**KPI:** en tu próxima llamada (práctica o real): nivel 2 alcanzado, al menos un «más o menos» cazado y la transición sí/no/quizá formulada antes del pitch.", "adjuntos": [{"nombre": "F4-guia-discovery.pdf", "tipo": "PDF", "nota": "Los 3 niveles, el árbol de la pregunta grande, las 5 antesalas y las preguntas de pre-manejo.", "estado": "falta"}], "pantallaReal": ""}, {"id": "L6", "emoji": "💳", "titulo": "El pitch con demo y el cierre", "duracion": "12-16 min", "descripcion": "Presentas tu solución en menos de cuatro minutos, la enseñas funcionando en directo y cobras el piloto antes de colgar.\n\n**En esta lección:**\n- Tres pilares construidos con las palabras de SU discovery, no con las de un catálogo.\n- La demo: resultado antes que tecnología, silencio tras el wow, y jamás improvisar una función no testeada.\n- El precio del piloto con una frase de contexto — y después, silencio.\n- El enlace de pago de Stripe en la llamada, el «no te re-vendas» tras el sí y el socio ausente como única excepción de seguimiento.\n\n**Tu acción ahora:** escribe tus tres pilares, cronometra tu pitch con demo y ensaya la secuencia completa precio → silencio → enlace de pago con un compañero de la comunidad, usando tu enlace de Stripe en modo prueba.\n\n**KPI:** pitch + demo ejecutados en menos de 7 minutos cronometrados y secuencia de cobro ensayada de principio a fin (enlace enviado y «pagado» en modo prueba).", "adjuntos": [{"nombre": "F4-framework-llamada.pdf", "tipo": "PDF", "nota": "Repasa aquí las fases de pitch y cierre del mapa (ya descargado en L4).", "estado": "repetido", "ruta": "ya subido en L4"}], "pantallaReal": "Stripe: Payment Link enviado al chat de la videollamada + pantalla de pago completado (datos ficticios). Y el tramo pitch → demo → precio de la llamada modelo grabada."}, {"id": "L7", "emoji": "⚖️", "titulo": "Objeciones: casi todas se previenen", "duracion": "10-14 min", "descripcion": "Aprendes a leer una objeción como lo que es —un aviso de que el discovery se quedó corto veinte minutos antes— y a manejar con calma las que aun así lleguen.\n\n**En esta lección:**\n- El 80% son cortinas de humo: tu trabajo no es responder a la cortina, sino llegar a lo que esconde.\n- El umbral de acción: confianza, dolor y deseo frente a duda, comodidad e inercia.\n- Los 5 tipos reales —dinero, miedo, confianza, momento y socio— y la regla de aislar el dinero primero.\n- Calma + pregunta, sin empatía azucarada. Los 3 miedos del vendedor y cuándo soltar con elegancia.\n\n**Tu acción ahora:** abre la guía de objeciones, reescribe con tus palabras los diálogos de los 5 tipos y ensáyalos en voz alta con un compañero: él te lanza objeciones al azar, tú aíslas el dinero y respondes con calma + pregunta.\n\n**KPI:** los 5 tipos ensayados en voz alta (con compañero o grabándote) y tu versión escrita de la pregunta para aislar el dinero.", "adjuntos": [{"nombre": "F4-guia-objeciones.pdf", "tipo": "PDF", "nota": "El umbral de acción, la tabla de cortinas de humo y los diálogos modelo de los 5 tipos.", "estado": "falta"}], "pantallaReal": "El propio PDF de la guía de objeciones abierto en la tabla de cortinas de humo: scroll corto sobre el entregable ya maquetado."}, {"id": "L8", "emoji": "🔁", "titulo": "Practica como un profesional", "duracion": "8-12 min", "descripcion": "Enciendes el sistema que convierte cada llamada en mejora: las prácticas, el análisis con Claude y el tracker. Vender no se estudia, se entrena.\n\n**En esta lección:**\n- 5 llamadas de práctica antes de la primera real: roles en serio, sin piedad y rúbrica de 1 a 5.\n- Graba tus llamadas con permiso y pásale la transcripción a Claude con el prompt del programa.\n- La rutina de revisión de L2, ahora con materia prima: una buena por la mañana, una mala por la noche.\n- El tracker y la regla 30: nada se juzga antes de 30 llamadas realizadas. Si cierras en benchmark, la respuesta es MÁS reuniones.\n\n**Tu acción ahora:** repasa las 5 llamadas de práctica que agendaste en L2 —la primera cae esta semana; si alguna se ha caído, reagéndala hoy en la comunidad—. Después copia el tracker de ventas y crea la fila de tu próxima reunión real.\n\n**KPI:** 5 llamadas de práctica realizadas y puntuadas con la rúbrica + tracker en marcha con tus primeras llamadas registradas y analizadas con Claude.", "adjuntos": [{"nombre": "F4-guia-llamadas-practica.pdf", "tipo": "PDF", "nota": "Las 5 prácticas obligatorias en orden, los briefs de rol, la rúbrica imprimible y el prompt de análisis.", "estado": "repetido", "ruta": "ya subido en L2"}, {"nombre": "F4-tracker-ventas.csv", "tipo": "CSV", "nota": "Plantilla para duplicar: show rate y close rate por fórmula, con la regla 30 en la fila congelada.", "estado": "listo", "ruta": "adjuntos-skool/5-cierra/L08-F4-tracker-ventas.csv · L08-F4-tracker-ventas-totales-semanales.csv"}], "pantallaReal": "Claude analizando una transcripción (prompt pegado a la izquierda, veredicto a la derecha), el tracker relleno en Google Sheets/Notion y el vídeo íntegro de la llamada modelo (~15 min)."}]}, {"codigo": "F5", "nombreCurso": "F5 | Entrega — del cobro al cliente encantado", "palabraTarjeta": "Entrega", "descripcionCurso": "Ya has cobrado a tu primer cliente: aquí conviertes ese pago en una entrega impecable. Llamada de arranque, build en días, traspaso con criterios firmados, testimonio capturado en caliente y tu primera plantilla reutilizable.", "semanas": "Semanas 8-11", "lecciones": [{"id": "L1", "emoji": "🗺️", "titulo": "Cobrado ≠ terminado: el viaje de tu cliente", "duracion": "6-9 min", "descripcion": "Te llevas el mapa completo de lo que pasa entre el cobro y la propuesta de retainer, y por qué las primeras 24 horas deciden la relación entera.\n\n**En esta lección:**\n- Las 24 horas críticas: el 80% del arrepentimiento de compra ocurre ahí, y se alimenta del silencio. La regla es cero tiempo muerto post-pago.\n- El viaje en 7 estaciones: cobro → formulario de arranque → llamada de arranque → build → entrega y traspaso → cobro final → semilla del retainer.\n- Las dos vías que gestionas a la vez: el trabajo real (invisible) y la experiencia percibida. El cliente no ve tu esfuerzo, ve lo que le enseñas.\n- Plazos con infrapromesa: comprometes 7 días y planificas 5, un ~30% de margen en todo plazo que sale de tu boca.\n\n**Tu acción ahora:** abre la ficha de tu cliente en tu tracker de ventas de F4 y pon fecha a cada estación del viaje: formulario HOY, llamada de arranque en menos de 48h, entrega interna (día 5) y entrega comprometida (día 7). Apúntalas también en tu calendario.\n\n**KPI:** viaje del cliente fechado en el tracker, con las dos fechas de entrega —interna y comprometida— separadas por el margen del ~30%.", "adjuntos": [{"nombre": "F4-tracker-ventas.csv", "tipo": "CSV", "nota": "(ya descargado en F4) Aquí le pones fecha a cada estación del viaje.", "estado": "repetido", "ruta": "ya subido en F4 · L8"}], "pantallaReal": ""}, {"id": "L2", "emoji": "📞", "titulo": "La llamada de arranque", "duracion": "10-14 min", "descripcion": "Sales con el onboarding de tu cliente ejecutado entero: formulario enviado el mismo día del cobro, llamada de 30-45 minutos hecha y acuerdo firmado.\n\n**En esta lección:**\n- El formulario de arranque: qué recoge y por qué sale EN cuanto paga. Móntalo ahora, antes de tener cliente.\n- La llamada es tu segunda venta, y el paso 1 es RE-VENDER: un cliente recién pagado necesita reafirmación, no silencio.\n- Alcance ENTRA/NO ENTRA leído en voz alta y criterios de aceptación pactados AHORA: entre 3 y 7 checks verificables que definen \"terminado\".\n- Accesos, fechas con margen, canal único con 1 toque visible al día y firma del acuerdo. Sin acuerdo firmado no arranca el build. Y nada de prometer extras en caliente: \"lo apunto para la fase 2\".\n\n**Tu acción ahora:** adapta el formulario de arranque a tu solución y déjalo listo para enviar, haz tu copia del guion de la llamada con tus frases y manda el acuerdo-esqueleto adaptado a revisión de un abogado.\n\n**KPI:** formulario enviado el mismo día del cobro + llamada de arranque hecha con criterios de aceptación pactados y acuerdo firmado.", "adjuntos": [{"nombre": "F5-guion-llamada-arranque.pdf", "tipo": "PDF", "n
